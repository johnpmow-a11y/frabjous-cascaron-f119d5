<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift Delivery Tracking — All Ads Manager</title><style>body{font:16px system-ui;background:#f5f7fb;color:#111827;margin:0;padding:22px}.box{max-width:650px;margin:7vh auto;background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:25px}.muted{color:#6b7280;line-height:1.5}.line{height:6px;background:#d1fae5;border-radius:9px;position:relative;margin:35px 0}.line:before{content:'';position:absolute;left:0;right:0;height:6px;background:#16a34a;animation:blink 1s infinite}.plane{position:absolute;top:-22px;left:0;font-size:27px;animation:fly 7s linear infinite}@keyframes fly{from{left:0}to{left:calc(100% - 30px)}}@keyframes blink{50%{opacity:.2}}.step{padding:12px 14px;border-left:4px solid #d1d5db;margin:10px 0;background:#f9fafb;border-radius:7px}.active{border-color:#16a34a}.btn{display:block;background:#111827;color:white;padding:13px;border-radius:12px;text-decoration:none;text-align:center;margin-top:20px}</style></head><body><main class="box"><h1>International Gift Delivery</h1><p class="muted">Tracking code: <b id="code"></b></p><div class="line"><span class="plane">✈️</span></div><h2 id="status">Checking order…</h2><p class="muted" id="info">Please wait.</p><div id="steps"></div><p class="muted">This page shows status updates entered by the All Ads Manager team. It does not show live GPS or independent courier scans.</p><a class="btn" href="/">Return to All Ads Manager</a></main><script>const code=new URLSearchParams(location.search).get('code')||'',regionNames=new Intl.DisplayNames(['en'],{type:'region'}),flagForCountry=c=>String.fromCodePoint(...c.split('').map(x=>127397+x.charCodeAt(0)));document.getElementById('code').textContent=code;async function load(){try{const r=await fetch('/.netlify/functions/delivery-track?code='+encodeURIComponent(code),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not find tracking code.');const o=d.order,labels=['processing','preparing','shipped','out_for_delivery','delivered'];document.getElementById('status').textContent=o.status.replaceAll('_',' ').toUpperCase();document.getElementById('info').textContent=o.item+' · '+flagForCountry(o.destination_country)+' '+regionNames.of(o.destination_country)+' · '+o.delivery_speed+' · Updated '+new Date(o.updated_at).toLocaleString();document.getElementById('steps').innerHTML=labels.map((x,i)=>'<div class="step '+(labels.indexOf(o.status)>=i?'active':'')+'">'+x.replaceAll('_',' ')+'</div>').join('');const days=o.delivery_speed==='one-week'?7:o.delivery_speed==='4-day'?4:1,eta=new Date(new Date(o.created_at).getTime()+days*86400000);let notice=document.getElementById('deliveryConfirm');if(!notice){notice=document.createElement('section');notice.id='deliveryConfirm';document.querySelector('.box').appendChild(notice)}if(Date.now()>=eta.getTime()&&o.status!=='delivered'){notice.innerHTML='<div class="step active"><b>Please confirm your delivery from the receiver.</b><p>If the receiver has not received it yet, wait for some minutes. It is processing. We assure you.</p><button class="btn" onclick="location.href=\'/\'">OK</button></div>';}else notice.innerHTML='';}catch(e){document.getElementById('status').textContent='Tracking unavailable';document.getElementById('info').textContent=e.message||'Please check your code.'}}load();setInterval(load,60000);</script></body></html>
