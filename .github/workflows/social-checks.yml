name: Social foundation checks
on:
  pull_request:
    paths:
      - "netlify/functions/social-*.mjs"
      - "netlify/functions/_push.mjs"
      - "public/social.js"
      - "public/social.css"
      - "public/index.html"
      - "public/coin-payment-return.html"
      - "scripts/check-social-contracts.mjs"
      - "supabase/migrations/*.sql"
      - ".github/workflows/social-checks.yml"
  push:
    branches:
      - feature/social-feed-coins-foundation
      - feature/aam-separated-coins-and-ads-readiness
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check social feature contracts
        run: node scripts/check-social-contracts.mjs
      - name: Check Netlify function syntax
        run: |
          node --check netlify/functions/_push.mjs
          node --check netlify/functions/social-core.mjs
          node --check netlify/functions/social-feed.mjs
          node --check netlify/functions/social-interactions.mjs
          node --check netlify/functions/social-chat.mjs
          node --check netlify/functions/social-discover.mjs
          node --check netlify/functions/social-admin.mjs
          node --check netlify/functions/social-notifications.mjs
          node --check netlify/functions/social-coin-create.mjs
          node --check netlify/functions/social-coin-verify.mjs
          node --check netlify/functions/paystack-webhook.mjs
          node --check public/social.js
