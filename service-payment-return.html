<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Payment Status — All Ads Manager</title><style>body{font:16px system-ui;background:#f5f7fb;color:#111827;margin:0;padding:24px}.box{max-width:560px;margin:12vh auto;background:white;border:1px solid #e5e7eb;border-radius:20px;padding:28px;text-align:center}.btn{display:block;background:#111827;color:white;padding:14px;border-radius:12px;text-decoration:none;margin-top:20px}</style></head><body><main class="box"><h1 id="title">Verifying your payment…</h1><p id="message">Please wait. Do not close this page.</p><a class="btn" href="/" id="back">Return to ADS Manager</a></main><script>const q=new URLSearchParams(location.search),reference=q.get('reference')||q.get('trxref')||'',token=sessionStorage.getItem('btToken');async function verify(){if(!reference||!token){document.getElementById('title').textContent='Sign in required';document.getElementById('message').textContent='Return to ADS Manager and sign in to check this payment.';return}try{const r=await fetch('/.netlify/functions/paystack-service-verify?reference='+encodeURIComponent(reference)+'&token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(d.status==='paid'){document.getElementById('title').textContent='Payment verified';if(d.service==='International Gift Delivery'){document.getElementById('message').innerHTML='Payment verified. Your tracking code is <b>'+String(d.tracking_code||'being registered')+'</b>. <a href="/tracking.html?code='+encodeURIComponent(d.tracking_code||'')+'">Track your delivery</a>.';return}document.getElementById('message').textContent=d.service==='TikTok Account Funding'?'Please wait five minutes. After five minutes, go LIVE on your TikTok account for over 20 minutes. Your coin amount depends on how much you paid. Thank you for purchasing with All Ads Manager. Coin fulfilment is subject to supplier/manual confirmation.':d.service==='Create Your Consignment Box Video'?'Payment verified. Your Consignment Box Video is processing. The estimated processing time is five hours. Please check your History after five hours. If it is not ready, it will continue to show Processing.':(d.message||'Your payment is verified. The service request is awaiting fulfilment.');return}document.getElementById('title').textContent='Payment not yet confirmed';document.getElementById('message').textContent=d.message||d.error||'We could not verify payment yet. Please check again shortly.'}catch(e){document.getElementById('title').textContent='Verification temporarily unavailable';document.getElementById('message').textContent='Please return later and check your service payment status.'}}verify();</script></body></html>
