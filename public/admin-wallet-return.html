<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Admin Wallet Payment</title><style>body{font:16px Arial,sans-serif;background:#f3f5f9;color:#172033;padding:25px}.card{max-width:520px;margin:12vh auto;background:#fff;padding:26px;border-radius:16px;box-shadow:0 5px 20px #15223a12}a{display:inline-block;background:#155eef;color:white;text-decoration:none;padding:13px 18px;border-radius:9px;margin-top:15px}.muted{color:#64748b}.error{color:#b42318}</style></head><body><main class="card"><h2>Admin Wallet Payment</h2><p id="message" class="muted">Verifying your Paystack payment securely…</p><a href="/admin-wallet.html">Open Admin Wallet</a></main><script>
(async function(){const q=new URLSearchParams(location.search),reference=q.get('reference')||'',token=sessionStorage.getItem('btAdminToken'),el=document.getElementById('message');if(!reference||!token){el.className='error';el.textContent='Payment reference or admin session is missing. Log in again and check Admin Wallet deposits.';return}try{const r=await fetch('/.netlify/functions/admin-wallet-verify?reference='+encodeURIComponent(reference)+'&token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Payment verification failed.');el.textContent=d.message||'Payment status: '+d.status;if(d.status!=='success')el.className='error'}catch(e){el.className='error';el.textContent=e.message||'Could not verify payment.'}})();
</script></body></html>
