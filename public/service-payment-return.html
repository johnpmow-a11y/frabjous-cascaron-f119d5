<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Service Payment Status — All Ads Manager</title><style>body{font:16px system-ui;background:#f5f7fb;color:#111827;margin:0;padding:24px}.box{max-width:560px;margin:12vh auto;background:white;border:1px solid #e5e7eb;border-radius:20px;padding:28px;text-align:center}.btn{display:block;background:#111827;color:white;padding:14px;border-radius:12px;text-decoration:none;margin-top:20px}.muted{color:#6b7280;line-height:1.6}#count{font-size:42px;font-weight:800;margin:16px 0}</style></head><body><main class="box"><h1 id="title">Verifying your payment…</h1><p id="message" class="muted">Please wait while All Ads Manager confirms your payment.</p><div id="count"></div><a class="btn" href="/" id="back">Return to All Ads Manager and check History</a></main><script>
const q=new URLSearchParams(location.search),reference=q.get('reference')||q.get('trxref')||'',token=sessionStorage.getItem('btToken');
const title=document.getElementById('title'),message=document.getElementById('message'),count=document.getElementById('count');
function showTimer(availableAt){
 const end=new Date(availableAt).getTime();
 function tick(){
  const left=Math.max(0,end-Date.now());
  if(left<=0){count.textContent='';title.textContent='Processing window complete';message.textContent='Go to your Facebook account and check your Ads balance. If the funds are not showing, open All Ads Manager History to see the latest order status.';return;}
  const mins=Math.floor(left/60000),secs=Math.floor((left%60000)/1000);
  count.textContent=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
  message.textContent='Your payment is verified. Please allow up to 18 minutes for processing. You may leave this page; the waiting period continues.';
  setTimeout(tick,1000);
 }
 tick();
}
async function verify(){
 if(!reference||!token){title.textContent='Sign in required';message.textContent='Return to All Ads Manager, sign in, and open History to check your service payment.';return;}
 try{
  const r=await fetch('/.netlify/functions/paystack-service-verify?reference='+encodeURIComponent(reference)+'&token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();
  if(d.status==='paid'){
   title.textContent='Payment verified';
   if(d.service==='Gift Card'){message.textContent='Your gift-card order has been sent to the administrator. Please wait; the gift-card code will appear in your History when it is delivered.';return;}
   if(d.service==='Fund Facebook Ads'&&d.processing_available_at){showTimer(d.processing_available_at);return;}
   if(d.service==='International Gift Delivery'){message.innerHTML='Payment verified. Your tracking code is <b>'+String(d.tracking_code||'being registered')+'</b>. <a href="/tracking.html?code='+encodeURIComponent(d.tracking_code||'')+'">Track your delivery</a>.';return;}
   message.textContent=d.service==='TikTok Account Funding'?'Please wait five minutes. After five minutes, go LIVE on your TikTok account for over 20 minutes. Your coin amount depends on how much you paid. Thank you for purchasing with All Ads Manager. Coin fulfilment is subject to supplier/manual confirmation.':d.service==='Create Your Consignment Box Video'?'Payment verified. Your Consignment Box Video is processing. The estimated processing time is five hours. Please check your History after five hours. If it is not ready, it will continue to show Processing.':(d.message||'Your payment is verified. The service request is awaiting fulfilment.');
   return;
  }
  title.textContent='Payment not yet confirmed';message.textContent=d.message||d.error||'We could not verify payment yet. Please check again shortly. Do not pay again unless Paystack confirms the first attempt failed.';
 }catch(e){title.textContent='Verification temporarily unavailable';message.textContent='Please return later and check your service payment status in All Ads Manager History.';}
}
verify();
</script></body></html>
