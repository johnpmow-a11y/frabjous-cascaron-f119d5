async function adminWorkingPictures(){if(!sessionStorage.getItem('btAdminToken'))return adminLogin();shell('<button class="btn secondary back" onclick="admin()">← Back to Admin</button><h2>Submit Working Pictures</h2><p class="muted">Select as many pictures as needed. Publish another batch at any time; there is no overall gallery limit. Each picture is ₦14,100.</p><section class="working-upload-panel"><label for="workingPictureFiles">Choose pictures to publish</label><input id="workingPictureFiles" type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/gif" multiple><p class="muted">JPG, PNG, WEBP, AVIF or GIF. Maximum 20 MB per picture. Select as many pictures as you need; they upload together in parallel batches.</p><button class="btn" id="workingPictureUploadButton" style="margin-top:12px">Publish Selected Pictures</button><div id="workingPictureUploadProgress" class="working-upload-progress" aria-live="polite"></div></section><h3>Published Gallery</h3><div id="adminWorkingPictureList" class="working-picture-grid"><p class="muted">Loading…</p></div><div id="adminWorkingPictureMore" class="working-gallery-toolbar"></div>');document.getElementById('workingPictureUploadButton').addEventListener('click',uploadWorkingPictures);workingPictureCache=[];workingPictureOffset=0;await loadAdminWorkingPictures(true)}
async function uploadWorkingPictures(){const input=document.getElementById('workingPictureFiles'),files=Array.from(input?.files||[]),button=document.getElementById('workingPictureUploadButton'),status=document.getElementById('workingPictureUploadProgress'),token=sessionStorage.getItem('btAdminToken');if(!files.length)return toast('Select one or more pictures first.');if(files.some(f=>!['image/jpeg','image/png','image/webp','image/avif','image/gif'].includes(f.type)))return toast('One or more files are not supported picture formats.');if(files.some(f=>f.size>20971520))return toast('Each picture must be 20 MB or smaller.');if(button){button.disabled=true;button.textContent='Publishing selected pictures…'}let done=0,failed=[],next=0;const concurrency=Math.min(5,files.length);if(status)status.textContent='Starting '+files.length+' pictures…';async function uploadOne(file){try{const sign=await fetch('/.netlify/functions/professional-working-pictures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'sign_upload',token,filename:file.name,mime_type:file.type})}),sd=await sign.json();if(!sign.ok)throw new Error(sd.error||'Could not prepare upload.');const up=await uploadStorageFile('professional-working-pictures',sd.path,sd.token,file,pct=>{if(status)status.textContent='Uploading '+file.name+' · '+pct+'% · '+done+' of '+files.length+' published.';});if(up.error)throw up.error;const pub=await fetch('/.netlify/functions/professional-working-pictures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'publish',token,path:sd.path,public_url:sd.public_url,original_name:file.name})}),pd=await pub.json();if(!pub.ok)throw new Error(pd.error||'Could not publish picture.');done++;}catch(e){failed.push(file.name+': '+(e.message||'upload failed'));}finally{if(status)status.textContent='Published '+done+' of '+files.length+'. Failed: '+failed.length+'. Uploading '+Math.min(files.length,done+failed.length+concurrency)+' of '+files.length+'…';}}async function worker(){while(true){const index=next++;if(index>=files.length)return;await uploadOne(files[index]);}}await Promise.all(Array.from({length:concurrency},()=>worker()));if(status)status.textContent='Finished. Published '+done+' of '+files.length+'. Failed: '+failed.length+(failed.length?'\n'+failed.join('\n'):'');if(button){button.disabled=false;button.textContent='Publish Selected Pictures'}if(done){toast(done+' picture(s) published for customers.');input.value='';await loadAdminWorkingPictures(true)}if(failed.length)toast(failed.length+' picture(s) failed. See the upload report.');}
async function loadAdminWorkingPictures(reset=false){const box=document.getElementById('adminWorkingPictureList'),more=document.getElementById('adminWorkingPictureMore');if(!box)return;try{const offset=reset?0:(workingPictureOffset||0),r=await fetch('/.netlify/functions/professional-working-pictures?limit=30&offset='+offset,{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load published pictures.');const list=d.pictures||[];if(reset){workingPictureCache=[];box.innerHTML=''}workingPictureCache.push(...list);box.insertAdjacentHTML('beforeend',list.map(p=>'<article class="working-picture-card"><img loading="lazy" src="'+esc(p.public_url)+'" alt="Published working picture"><div class="working-picture-info"><div class="working-picture-price">₦14,100</div><div class="working-picture-name">'+esc(p.original_name)+'</div></div></article>').join(''));if(!workingPictureCache.length)box.innerHTML='<p class="muted">No pictures published yet.</p>';workingPictureOffset=d.nextOffset??null;if(more)more.innerHTML=workingPictureOffset!==null?'<button class="btn secondary" id="adminWorkingPictureLoadMore">Load More</button>':'';document.getElementById('adminWorkingPictureLoadMore')?.addEventListener('click',()=>loadAdminWorkingPictures())}catch(e){box.innerHTML='<p class="muted">'+esc(e.message||'Could not load pictures.')+'</p>'}}

 if(!guard())return;
 shell(`<button class="btn secondary back" onclick="profile()">← Back</button><section class="profile-card"><span class="eyebrow">LIVE SUPPLIER CATALOGUE</span><h2>Virtual Verification Numbers</h2><div class="sms-toolbar"><div><label for="smsService">Service</label><select id="smsService" onchange="refreshUltraSmsCatalog()"><option value="">Loading available services…</option></select></div><div><label for="smsCountrySearch">Search country</label><input id="smsCountrySearch" type="search" placeholder="Type a country, e.g. USA or UK" autocomplete="off" oninput="filterUltraSmsCountries()"><label for="smsCountry">Country (scroll to browse)</label><select id="smsCountry" onchange="refreshUltraSmsCatalog()"><option value="NG">🇳🇬 Nigeria</option></select></div></div><button class="btn" id="smsRefresh" onclick="refreshUltraSmsCatalog()">Refresh live stock</button><button class="btn secondary" style="margin-top:8px" onclick="loadUltraSmsMyOrders()">My Number Orders</button><div id="smsMyOrders" style="margin-top:14px"></div><div id="smsBalance" class="payment-note" style="margin-top:14px">Checking supplier connection…</div><div id="smsStock" class="sms-stock"></div><p id="smsUpdated" class="muted" style="margin-top:14px"></p></section>`);
 await refreshUltraSmsCatalog(true);

}

function renderUltraSmsCountryOptions(preferred){const select=document.getElementById('smsCountry');if(!select)return;const rows=window.ultraSmsCountries||[];const q=String(document.getElementById('smsCountrySearch')?.value||'').trim().toLowerCase();const aliases={usa:['usa','us','united states','america'],uk:['uk','gb','great britain','united kingdom','britain']};const terms=[q,...(aliases[q]||[])];const filtered=rows.filter(x=>{const code=String(x.code||'').toLowerCase(),name=String(x.name||'').toLowerCase(),dial=String(x.dial_code||'').toLowerCase();return !q||terms.some(t=>code.includes(t)||name.includes(t)||dial.includes(t));});const displayNames=new Intl.DisplayNames(['en'],{type:'region'});select.innerHTML=filtered.map(x=>{const code=String(x.code||'').toUpperCase();const flag=/^[A-Z]{2}$/.test(code)?code.replace(/[A-Z]/g,ch=>String.fromCodePoint(127397+ch.charCodeAt(0))):'';let name=x.name||code;try{name=displayNames.of(code)||name}catch{}return '<option value="'+esc(code)+'">'+flag+' '+esc(name)+' (+'+esc(x.dial_code||'')+')</option>';}).join('')||'<option value="">No matching country</option>';select.value=filtered.some(x=>String(x.code).toUpperCase()===preferred)?preferred:(filtered[0]?.code||'');}
let ultraSmsCountrySearchTimer=null;function filterUltraSmsCountries(){const select=document.getElementById('smsCountry');const current=select?.value||'NG';renderUltraSmsCountryOptions(current);if(ultraSmsCountrySearchTimer)clearTimeout(ultraSmsCountrySearchTimer);ultraSmsCountrySearchTimer=setTimeout(()=>{const next=document.getElementById('smsCountry')?.value;if(next&&next!==current)refreshUltraSmsCatalog(false);},350);}
async function refreshUltraSmsCatalog(initial=false){
 const service=document.getElementById('smsService')?.value||'wa',country=document.getElementById('smsCountry')?.value||'NG';
 const button=document.getElementById('smsRefresh'),stock=document.getElementById('smsStock'),balance=document.getElementById('smsBalance');
 if(button){button.disabled=true;button.textContent='Refreshing…'}
 if(stock)stock.innerHTML='<div class="muted">Loading current supplier stock…</div>';
 try{
  const response=await fetch(`/.netlify/functions/ultra-sms-catalog?token=${encodeURIComponent(sessionStorage.getItem('btToken')||'')}&service=${encodeURIComponent(service)}&country=${encodeURIComponent(country)}`,{headers:{'Accept':'application/json'},cache:'no-store'});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not load the supplier catalogue.');
  const serviceSelect=document.getElementById('smsService'),countrySelect=document.getElementById('smsCountry');
  if(serviceSelect){const oldService=serviceSelect.value;serviceSelect.innerHTML=(data.services||[]).map(x=>`<option value="${esc(x.code)}">${esc(x.name||x.code)}</option>`).join('');serviceSelect.value=(data.services||[]).some(x=>x.code===oldService)?oldService:((data.services||[]).some(x=>x.code==='wa')?'wa':(data.services||[])[0]?.code||'');}
  if(countrySelect&&data.countries?.length){window.ultraSmsCountries=data.countries.map(x=>({...x,code:String(x.code||'').toUpperCase()}));renderUltraSmsCountryOptions(countrySelect.value||'NG');}
  if(balance)balance.textContent='Connected to UltraSMS. Live prices and stock loaded.';
  if(stock){const rows=data.prices||[];stock.innerHTML=rows.length?rows.map(x=>`<article><strong>${esc(x.name||data.selectedServiceName||'Verification service')}</strong><div class="muted">Country: ${esc(x.country||country)} · Server: ${esc(x.server)}</div><div class="price">${x.customer_price_ngn==null?'Price setup pending':money(x.customer_price_ngn)}</div><div class="muted">Available stock: <b>${Number(x.count||0).toLocaleString()}</b></div><button class="btn" ${Number(x.count||0)<1||x.customer_price_ngn==null?'disabled':''} onclick="buyUltraSmsNumber('${esc(service)}','${esc(x.country||country)}',${Number(x.server)},'${esc(x.name||data.selectedServiceName||'Verification service')}','${esc((data.countries||[]).find(c=>c.code===(x.country||country))?.name||x.country||country)}',${Number(x.price_cents)},${Number(x.customer_price_ngn)})">Buy number</button></article>`).join(''):'<div class="empty">No stock is currently listed for this service and country. Try another country or refresh later.</div>';if(!data.pricingReady&&balance)balance.textContent+=' · Set USD/NGN rate and markup in Netlify before sales are enabled.';}
  const updated=document.getElementById('smsUpdated');if(updated)updated.textContent=`Live supplier catalogue checked: ${new Date().toLocaleString()}. Stock and prices can change before an order.`;
  // If the first call normalized the dropdown to another available option, refresh its price rows.
  if(initial&&(serviceSelect?.value!==service||countrySelect?.value!==country))return refreshUltraSmsCatalog(false);
 }catch(e){if(balance)balance.textContent='Supplier connection error: '+(e.message||'Unknown error');if(stock)stock.innerHTML='<div class="empty">Live catalogue could not be loaded. Check the Netlify deployment and ULTRA_SMS_API_KEY setting.</div>';}
 finally{if(button){button.disabled=false;button.textContent='Refresh live stock'}}
}

async function loadUltraSmsMyOrders(){const box=document.getElementById('smsMyOrders');if(!box)return;box.textContent='Loading your number orders…';try{const r=await fetch(`/.netlify/functions/ultra-sms-my-orders?token=${encodeURIComponent(sessionStorage.getItem('btToken')||'')}`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load orders.');box.innerHTML=(d.orders||[]).map(o=>`<article class="history-item"><strong>${esc(o.service_name)} · ${esc(o.country_code)}</strong><p>${esc(o.phone||'Number pending')} · ${esc(o.status)}</p><p>${o.sms_code?'OTP: '+esc(o.sms_code):'No code received yet.'}</p><p>${o.refunded_at?'Wallet refunded.':'Charged: '+money(Number(o.customer_charge_kobo||0)/100)}</p><button class="btn secondary" onclick="resumeUltraSmsOrder('${esc(o.id)}')">View / Refresh Order</button></article>`).join('')||'<p class="muted">You have no number orders yet.</p>';}catch(e){box.textContent=e.message||'Could not load your orders.'}}
function resumeUltraSmsOrder(id){ultraSmsCurrentOrderId=id;pollUltraSmsOrder(id);if(ultraSmsPollTimer)clearInterval(ultraSmsPollTimer);ultraSmsPollTimer=setInterval(()=>pollUltraSmsOrder(id),5000);}
let ultraSmsPollTimer=null;let ultraSmsCurrentOrderId=null;
async function buyUltraSmsNumber(service,country,server,serviceName,countryName,priceCents,displayedNgn){
 if(!guard())return;
 const ok=confirm(`Buy one ${serviceName} number for ${countryName} for ${money(displayedNgn)}? This amount will be deducted from your ADS MANAGER wallet.`);
 if(!ok)return;
 const stock=document.getElementById('smsStock');
 if(stock)stock.insertAdjacentHTML('afterbegin','<div class="payment-note" id="smsOrderNotice">Creating your number order. Please do not close this page or press Buy again…</div>');
 try{
  const response=await fetch('/.netlify/functions/ultra-sms-order-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btToken'),service,country,server,service_name:serviceName,country_name:countryName,displayed_price_cents:priceCents,displayed_customer_price_ngn:displayedNgn})});
  const result=await response.json();
  if(!response.ok&&!result.pending)throw new Error(result.error||'Could not purchase this number.');
  if(result.pending){const n=document.getElementById('smsOrderNotice');if(n)n.textContent=result.message||'Supplier confirmation is pending. Please do not purchase again.';return;}
  const o=result.order||{};ultraSmsCurrentOrderId=o.id||null;
  const n=document.getElementById('smsOrderNotice');if(n)n.outerHTML=`<div class="payment-note" id="smsOrderNotice"><b>Order status: ${esc(o.status||'waiting')}</b><br>${o.phone?'Your number: '+esc(o.phone):'Waiting for supplier number…'}<br><span id="smsOtpText">${o.code?'Verification code: '+esc(o.code):'Waiting for SMS verification code…'}</span><br><span id="smsOrderStatusHint">We check for the code every five seconds. This is a temporary activation, normally valid for up to 20 minutes.</span></div>`;
  if(ultraSmsPollTimer)clearInterval(ultraSmsPollTimer);
  if(o.id)ultraSmsPollTimer=setInterval(()=>pollUltraSmsOrder(o.id),5000);
  pollUltraSmsOrder(o.id);
 }catch(e){const n=document.getElementById('smsOrderNotice');if(n)n.textContent=e.message||'Order failed.';}
}
async function pollUltraSmsOrder(orderId){
 if(!orderId)return;
 try{const r=await fetch(`/.netlify/functions/ultra-sms-order-status?token=${encodeURIComponent(sessionStorage.getItem('btToken')||'')}&order_id=${encodeURIComponent(orderId)}`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not check order.');const o=d.order||{};const box=document.getElementById('smsOrderNotice');if(!box)return;
 box.innerHTML=`<b>Order status: ${esc(o.status||'pending')}</b><br>${o.phone?'Your number: '+esc(o.phone):'Waiting for supplier number…'}<br><span>${o.code?'Verification code: '+esc(o.code):'Waiting for SMS verification code…'}</span><br><span>${o.refunded?'Your ADS MANAGER wallet has been refunded.':o.status==='received'?'Your SMS code has arrived. Use it only for an account you are authorized to verify.':'We check for the code every five seconds. The activation is temporary.'}</span>`;
 if(o.status==='waiting')box.innerHTML+=`<br><button class="btn secondary" onclick="actUltraSmsOrder('cancel')">Cancel order (available after 2 minutes)</button>`;if(o.status==='received')box.innerHTML+=`<br><button class="btn" onclick="actUltraSmsOrder('finish')">Finish activation</button>`;if(['received','finished','cancelled','expired','failed'].includes(o.status)){if(ultraSmsPollTimer)clearInterval(ultraSmsPollTimer);ultraSmsPollTimer=null;}
 }catch(e){const hint=document.getElementById('smsOrderStatusHint');if(hint)hint.textContent=e.message||'Order status temporarily unavailable.';}
}
async function actUltraSmsOrder(action){if(!ultraSmsCurrentOrderId)return;const question=action==='cancel'?'Cancel this activation? UltraSMS only permits cancellation after the first two minutes and before a code arrives.':'Finish this activation?';if(!confirm(question))return;try{const r=await fetch('/.netlify/functions/ultra-sms-order-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btToken'),order_id:ultraSmsCurrentOrderId,action})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not update order.');await pollUltraSmsOrder(ultraSmsCurrentOrderId);}catch(e){toast(e.message||'Could not update the activation.')}}
function mediaEditForm(kind){

let html='<button class="btn secondary back" onclick="profile()">← Back</button><div class="form"><h2>'+service+'</h2><p class="muted">'+(video?'Upload a picture for video editing. Describe it in up to 86 characters.':'Upload a picture for a safe clothing style or colour adjustment. 18+ only. This does not remove clothing or create nudity.')+'</p><label>Choose picture</label><div id="mediaEditPreview" class="media-edit-upload">Your selected picture will appear here.</div><input id="mediaEditFile" type="file" accept="image/*" onchange="previewMediaEditPhoto(event)">';

async function submitMediaEdit(kind){if(!guard())return;const video=Number(kind)===1,file=document.getElementById('mediaEditFile')?.files?.[0],prompt=String(document.getElementById('mediaEditPrompt')?.value||'').trim();if(!file)return toast('Choose one picture.');if(video&&prompt.length>86)return toast('Maximum 86 characters.');const service=video?'Picture to Video Editing':'Adjust Clothes',price=Number(video?store.prices?.pictureToVideoPrice:store.prices?.adjustClothesPrice)||0;if(price<100)return toast('This service is not available yet. Please try again later.');try{const p=await readImageForCloud(file);const r=await fetch('/.netlify/functions/consignment-photo-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btToken'),photo_data:p.data,purpose:'media-edit'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Photo upload failed.');bankFlow({service:service,details:JSON.stringify({photo_path:d.photo_path,edit_instruction:video?prompt:'Safe clothing adjustment only'}),price:price,status:'Awaiting processing'});}catch(e){toast(e.message||'Could not submit your photo.');}}

function renderReadyAccountCountries(){

function filterReadyAccountCountries(){

function filterReadyAccounts(){
 const all=Array.isArray(window.rediprofilesServices)?window.rediprofilesServices:[];
 const query=String(document.getElementById('readyAccountSearch')?.value||'').trim().toLowerCase();
 const selectedCountry=String(document.getElementById('readyAccountCountry')?.value||'').trim().toLowerCase();
 const category=String(document.getElementById('readyAccountCategory')?.value||'');
 const rows=all.filter(item=>{
  const countryText=String(item.country||item.country_name||item.country_code||'').toLowerCase();
  const aliases={usa:['usa','us','united states','america'],uk:['uk','gb','great britain','united kingdom','britain']};
  const searchTerms=[query,...(aliases[query]||[])];
  const text=[item.name,item.category_name,item.description,item.country,item.country_name,item.country_code].join(' ').toLowerCase();
  const categoryMatch=!category||String(item.category_id??item.category??'')===category;
  const countryMatch=!selectedCountry||String(item.country_code||item.country||item.country_name||'').toLowerCase()===selectedCountry||countryText.includes(selectedCountry);
  const accountMatch=!query||searchTerms.some(term=>term&&text.includes(term));
  return categoryMatch&&countryMatch&&accountMatch;
 });
 const cards=document.getElementById('readyAccountCards');
 if(!cards)return;
 if(!rows.length){cards.innerHTML='<div class="empty">No matching accounts are available right now.</div>';return;}
 cards.innerHTML=rows.map(item=>{

  const description=String(item.description||'').slice(0,400);
  const image=item.profile_image_url||item.profileImageUrl||item.profile_picture_url||item.profile_photo_url||item.account_image_url||item.accountImageUrl||item.image_url||item.photo_url||item.thumbnail_url||item.avatar_url||item.image||'';
  const price=item.customer_price_ngn??item.price_ngn??(String(item.currency||'').toUpperCase()==='NGN'?item.price:null);
  const stock=Number(item.quantity_in_stock??item.stock??0);
  const followers=item.followers_count??item.follower_count??item.followers??null;
  const categoryName=item.category_name||'Social / Email Account';
  const isInstagram=(name+' '+categoryName+' '+description).toLowerCase().includes('instagram');
  const hasPhoto=!!image&&/^https:\/\//i.test(String(image));
  const photo=hasPhoto
   ?`<img src="${esc(image)}" alt="Actual supplier-provided account profile photo" style="width:100%;height:170px;object-fit:cover;border-radius:12px" loading="lazy" referrerpolicy="no-referrer">`
   :isInstagram?'<div class="empty" style="height:170px;display:grid;place-items:center">Instagram profile photo not supplied. Purchase unavailable until a photo is provided.</div>':'';
  const canBuy=price!=null&&Number.isFinite(Number(price))&&Number(price)>0&&stock>0&&item.is_active!==false&&(!isInstagram||hasPhoto);
  return `<article class="card">${photo}<p class="eyebrow">${esc(categoryName)}</p><h3>${esc(name)}</h3><div class="price">${price==null?'Price unavailable':money(price)}</div><p class="muted">Available: <b>${Number.isFinite(stock)?stock.toLocaleString():'Check availability'}</b></p>${followers==null?'':`<p class="muted">Followers: <b>${esc(followers)}</b></p>`}<button class="btn" ${canBuy?'':'disabled'} onclick="buyReadyAccount(this,'${esc(item.id)}',${Number(price)||0})">${canBuy?'Buy account':isInstagram&&!hasPhoto?'Profile photo required':'Currently unavailable'}</button></article>`;
 }).join('');
}
async function buyReadyAccount(button,serviceId,price){
 if(!guard())return;

 }
}

shell(`<button class="btn secondary back" onclick="profile()">← Back</button><div class="form"><span class="eyebrow">SERVICE REQUEST</span><h2>${esc(service)}</h2><p class="muted">Complete the details for your service request and proceed to secure Paystack checkout.</p>${html}${service==='Facebook Page'||service==='Facebook Phone'||service==='TikTok Dollar Funding'||service==='Netflix Login'||service==='International Gift Delivery'?'':`<div id="quote" class="payment-note" style="margin:16px 0">${service==='Facebook Ads'?'First day ₦8,500; each additional day ₦3,800.':service==='TikTok Ads'?'First day ₦10,500; each additional day ₦3,800.':service==='Zangi Ads'?'1 day ₦7,800; each additional day ₦2,800, up to 14 days.':'No price configured.'}</div>`}<button class="btn" onclick="${service==='TikTok Dollar Funding'?'submitTikTokFunding()':service==='Netflix Login'?'submitNetflixLogin()':service==='Facebook Phone'?'submitFacebookPhoneOrder()':service==='International Gift Delivery'?'submitDeliveryRequest()':`submitService(\'${service}\')`}">${service==='Facebook Page'?'Create Page':service==='TikTok Dollar Funding'||service==='Netflix Login'||service==='International Gift Delivery'?'Continue':'Submit Request'}</button></div>`);if(service==='Zangi Ads'||service==='TikTok Ads'||service==='Facebook Ads')updateServiceQuote(service);if(service==='Facebook Page')updateFacebookPageQuote();if(service==='TikTok Dollar Funding')updateTikTokFundingQuote();if(service==='International Gift Delivery'){renderDeliveryGallery();loadDeliveryGiftPrices().then(()=>{if(!document.getElementById('deliveryGallery'))return;renderDeliveryGallery();updateDeliveryQuote();});}}
function submitFacebookPhoneOrder(){if(!guard())return;const email=document.getElementById('fbBusinessEmail')?.value.trim()||'',accountId=document.getElementById('fbAdAccountId')?.value.trim()||'',twoFactor=document.getElementById('fbTwoFactor')?.value||'no',amount=Number(document.getElementById('fbTotalAmount')?.value||0),method=document.getElementById('fbPaymentMethod')?.value||'bank_transfer';if(!/^\S+@\S+\.\S+$/.test(email))return toast('Enter a valid business email.');if(!accountId)return toast('Enter your Facebook Page or Ad Account ID.');if(!Number.isInteger(amount)||amount<100||amount>3000000)return toast('Enter a total amount between ₦100 and ₦3,000,000.');const details={business_email:email,facebook_page_or_ad_account_id:accountId,two_factor_enabled:twoFactor,payment_method:method,total_amount_ngn:amount,security_note:'No password or 2FA code collected.'};bankFlow({service:'Facebook Phone',details:JSON.stringify(details),price:amount,status:'Awaiting payment and review'});}
function consignmentForm(){if(!guard())return;shell(`<button class="btn secondary back" onclick="profile()">← Back</button><div class="form"><span class="eyebrow">VIDEO PRODUCTION REQUEST</span><h2>Create Your Consignment Box Video</h2><p class="payment-note">Total price: <b>₦28,000</b>. After verified payment, processing continues on the server for an estimated five hours, even if you leave the website.</p><label>Goods type</label><select id="consGoods" onchange="toggleConsignmentOther()"><option>Gold Bar</option><option>Other</option></select><input id="consGoodsOther" placeholder="Describe other goods" style="display:none;margin-top:8px"><label>Currency / location</label><select id="consCurrency" onchange="toggleConsignmentCurrency()"><option value="USD|United States">US Dollar (USD)</option><option value="EUR|European Union">Euro (EUR)</option><option value="GBP|United Kingdom">British Pound (GBP)</option><option value="THB|Thailand">Thailand — Thai Baht (THB)</option><option value="VND|Vietnam">Vietnam — Vietnamese Dong (VND)</option><option value="OTHER|Other">Other country / currency</option></select><div id="consOtherCurrency" style="display:none"><label>Country</label><input id="consCountryOther" placeholder="Country"><label>Currency</label><input id="consCurrencyOther" placeholder="Currency code"></div><div id="consGoldQtyWrap"><label>Gold bar quantity (1–10)</label><input id="consGoldQty" type="number" min="1" max="10" value="1"></div><label>Items to include</label><label><input type="checkbox" class="consItem" value="Wristwatch" style="width:auto"> Wristwatch</label><label><input type="checkbox" class="consItem" value="iPhone 17 Pro Max" style="width:auto"> iPhone 17 Pro Max</label><label><input type="checkbox" class="consItem" value="iPhone 18 Pro Max" style="width:auto"> iPhone 18 Pro Max</label><label>Other item (optional)</label><input id="consCustomItem" placeholder="Enter another item"><label>Your full name</label><input id="consFullName" autocomplete="name"><label>Home address</label><textarea id="consAddress" autocomplete="street-address"></textarea><label>Date of birth</label><input id="consDob" type="date"><label>Upload exactly one picture</label><input id="consPhoto" type="file" accept="image/jpeg,image/png,image/webp"><p class="muted">Your picture and personal details are stored privately and are visible only to you and the administrator.</p><button class="btn" onclick="submitConsignmentBox()">Continue · ₦28,000</button></div>`)}
function toggleConsignmentOther(){const other=document.getElementById('consGoods')?.value==='Other';document.getElementById('consGoodsOther').style.display=other?'block':'none';document.getElementById('consGoldQtyWrap').style.display=other?'none':'block'}
function toggleConsignmentCurrency(){document.getElementById('consOtherCurrency').style.display=document.getElementById('consCurrency').value==='OTHER|Other'?'block':'none'}
async function submitConsignmentBox(){if(!guard())return;const file=document.getElementById('consPhoto')?.files?.[0],goods=document.getElementById('consGoods').value,other=document.getElementById('consGoodsOther').value.trim(),qty=Number(document.getElementById('consGoldQty').value),name=document.getElementById('consFullName').value.trim(),address=document.getElementById('consAddress').value.trim(),dob=document.getElementById('consDob').value,selected=document.getElementById('consCurrency').value.split('|');if(goods==='Other'&&!other)return toast('Describe the goods.');if(goods==='Gold Bar'&&(!Number.isInteger(qty)||qty<1||qty>10))return toast('Gold bar quantity must be from 1 to 10.');if(!name||address.length<8||!dob)return toast('Enter your full name, home address and date of birth.');if(!file||!file.type.startsWith('image/'))return toast('Upload exactly one picture.');let currency=selected[0],country=selected[1];if(currency==='OTHER'){currency=document.getElementById('consCurrencyOther').value.trim().toUpperCase();country=document.getElementById('consCountryOther').value.trim();if(!currency||!country)return toast('Enter the other country and currency.')}try{const photo=await readImageForCloud(file),up=await fetch('/.netlify/functions/consignment-photo-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btToken'),photo_data:photo.data})}),ud=await up.json();if(!up.ok)throw new Error(ud.error||'Could not securely upload your picture.');const items=[...document.querySelectorAll('.consItem:checked')].map(x=>x.value);if(document.getElementById('consCustomItem').value.trim())items.push(document.getElementById('consCustomItem').value.trim());if(!items.length)return toast('Select or enter at least one item.');const details={goods_type:goods,goods_other:goods==='Other'?other:null,currency_code:currency,country_name:country,gold_quantity:goods==='Gold Bar'?qty:0,items,customer_full_name:name,home_address:address,date_of_birth:dob,photo_path:ud.photo_path};bankFlow({service:'Create Your Consignment Box Video',details:JSON.stringify(details),price:28000,status:'Awaiting verified payment; five-hour processing starts after payment'});}catch(e){toast(e.message||'Could not prepare your consignment request.')}}
async function myConsignmentJobsPage(){if(!guard())return;showPageLoading('Loading your consignment videos…');try{const r=await fetch(`/.netlify/functions/consignment?token=${encodeURIComponent(sessionStorage.getItem('btToken')||'')}`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load your consignment videos.');shell(`<button class="btn secondary back" onclick="profile()">← Back</button><h2>My Consignment Box Videos</h2>${(d.jobs||[]).map(j=>`<article class="history-item"><strong>${esc(j.goods_type)} · ${esc(j.country_name)}</strong><p>Status: <b>${esc(j.status)}</b></p><p class="muted">${new Date(j.created_at).toLocaleString()} · Expected processing time: five hours from verified payment.</p>${j.status==='ready'&&j.video_url?`<a class="btn" href="${esc(j.video_url)}" target="_blank" rel="noopener">View / Save Your Video</a>`:`<p>${new Date(j.available_at).getTime()>Date.now()?'Processing. Please check your History after five hours.':'Still processing. Please check again later.'}</p>`}</article>`).join('')||'<div class="empty">No paid consignment video requests yet.</div>'}`,false)}catch(e){toast(e.message||'Could not load your consignment videos.')}}
async function adminConsignmentJobs(){if(!sessionStorage.getItem('btAdminToken'))return adminLogin();showPageLoading('Loading consignment jobs…');try{const r=await fetch(`/.netlify/functions/consignment?admin=1&token=${encodeURIComponent(sessionStorage.getItem('btAdminToken')||'')}`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load consignment jobs.');shell(`<button class="btn secondary back" onclick="admin()">← Back to Admin</button><h2>Consignment Box Video Jobs</h2>${(d.jobs||[]).map(j=>`<article class="history-item"><strong>${esc(j.customer_name)} · ${esc(j.goods_type)}</strong><p>Country / currency: ${esc(j.country_name)} · ${esc(j.currency_code)}</p><p>Gold quantity: ${Number(j.gold_quantity)} · Items: ${esc((j.items||[]).join(', '))}</p><p>Full name: ${esc(j.customer_full_name)} · DOB: ${esc(j.date_of_birth)}</p><p>Home address: ${esc(j.home_address)}</p><p>Status: <b>${esc(j.status)}</b> · Processing due: ${new Date(j.available_at).toLocaleString()}</p>${j.photo_url?`<a href="${esc(j.photo_url)}" target="_blank" rel="noopener"><img src="${esc(j.photo_url)}" alt="Customer consignment photo" style="max-width:150px;border-radius:12px"></a>`:''}${j.status==='ready'?'<p>Finished video already uploaded.</p>':`<label>Finished video (maximum 8 minutes)</label><input id="consVideo_${esc(j.id)}" type="file" accept="video/mp4,video/quicktime,video/webm"><button class="btn" style="margin-top:10px" onclick="uploadConsignmentVideo('${esc(j.id)}')">Upload Finished Video to Customer History</button>`}</article>`).join('')||'<div class="empty">No paid consignment jobs yet.</div>'}`,true)}catch(e){toast(e.message||'Could not load consignment jobs.')}}
async function uploadConsignmentVideo(id){const file=document.getElementById('consVideo_'+id)?.files?.[0];if(!file||!file.type.startsWith('video/'))return toast('Choose a video file.');const url=URL.createObjectURL(file),video=document.createElement('video');video.preload='metadata';video.onloadedmetadata=async()=>{const duration=video.duration;URL.revokeObjectURL(url);if(!Number.isFinite(duration)||duration<=0||duration>480)return toast('Video must be eight minutes or shorter.');try{toast('Preparing secure upload…');const sign=await fetch('/.netlify/functions/consignment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btAdminToken'),action:'sign_video_upload',job_id:id,mime_type:file.type})}),sd=await sign.json();if(!sign.ok)throw new Error(sd.error||'Could not prepare video upload.');const up=await uploadStorageFile('ads-manager-private',sd.path,sd.token,file,pct=>{if(pct%10===0)toast('Uploading video… '+pct+'%');});if(up.error)throw up.error;const done=await fetch('/.netlify/functions/consignment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btAdminToken'),action:'complete_video',job_id:id,path:sd.path,duration_seconds:duration})}),dd=await done.json();if(!done.ok)throw new Error(dd.error||'Could not publish the video.');toast('Video uploaded and added to the customer History.');await adminConsignmentJobs()}catch(e){toast(e.message||'Video upload failed.')}};video.onerror=()=>{URL.revokeObjectURL(url);toast('Could not read this video file.')};video.src=url}

async function enableAppNotifications(){if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window)){toast('This device or browser does not support background notifications.');return;}try{const permission=await Notification.requestPermission();if(permission!=='granted'){toast('Please allow notifications in your phone settings.');return;}const role=sessionStorage.getItem('btAdminToken')?'admin':'customer',token=role==='admin'?sessionStorage.getItem('btAdminToken'):sessionStorage.getItem('btToken');if(!token){toast('Please log in before enabling notifications.');return;}const registration=await navigator.serviceWorker.ready,configResponse=await fetch('/.netlify/functions/push-config',{cache:'no-store'}),config=await configResponse.json();if(!configResponse.ok||!config.publicKey)throw new Error(config.error||'Push notifications are not configured on the server yet.');let subscription=await registration.pushManager.getSubscription();if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(config.publicKey)});const response=await fetch('/.netlify/functions/push-subscriptions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'subscribe',role,token,subscription:subscription.toJSON()})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not save notification settings.');toast('Background notifications enabled for this device.');try{navigator.vibrate?.(25)}catch(e){}}catch(e){toast(e.message||'Could not enable background notifications.');}}

async function pollCustomerNotifications(){if(!current()||!sessionStorage.getItem('btToken'))return;try{const token=sessionStorage.getItem('btToken'),[supportResult,cloud,walletResult,mediaResult]=await Promise.allSettled([supportApi('GET'),rpc('bt_customer_get',{p_token:token}),rpc('bt_customer_wallet_get',{p_token:token}),fetch('/.netlify/functions/customer-media-messages?token='+encodeURIComponent(token),{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Private messages unavailable');return d.messages||[];})]);const messages=supportResult.status==='fulfilled'?(supportResult.value.messages||[]):[],notes=cloud.status==='fulfilled'?(cloud.value.notes||[]):[],media=mediaResult.status==='fulfilled'?mediaResult.value:[],incoming=[...messages.filter(x=>x.sender_role==='admin'&&!String(x.message||'').startsWith('[PRIVATE_MEDIA]')).map(x=>({id:'support:'+x.id,time:x.created_at,title:'New message from All Ads Manager',body:x.message})),...media.map(x=>({id:'media:'+x.id,time:x.created_at,title:'New message from All Ads Manager',body:x.message||(x.media_path?'You have received a picture or video.':'You have a new message.')})),...notes.map((x,i)=>({id:'note:'+(x.id||x.time||i),time:x.time||'',title:'New History update',body:x.text||''}))].filter(x=>x.id);const key='allAdsNoticeCursor:'+current(),walletKey='allAdsWalletSeen:'+current();let seen=customerNoticeSeen;if(!customerNoticeStarted){const saved=JSON.parse(localStorage.getItem(key)||'[]');seen=new Set(saved.concat(incoming.map(x=>x.id)));customerNoticeSeen=seen;customerNoticeStarted=true;localStorage.setItem(key,JSON.stringify([...seen].slice(-150)));if(walletResult.status==='fulfilled')localStorage.setItem(walletKey,String(walletResult.value.balance||0));}else{const fresh=incoming.filter(x=>!seen.has(x.id));for(const x of fresh){alertCustomerMessage(x.title,String(x.body).slice(0,160));seen.add(x.id);}if(fresh.length)localStorage.setItem(key,JSON.stringify([...seen].slice(-15 async function pollAdminNotifications(){if(!sessionStorage.getItem('btAdminToken'))return;try{const [supportResult,cloudResult]=await Promise.allSettled([supportApi('GET',{},'admin=1'),rpc('bt_admin_get',{p_token:sessionStorage.getItem('btAdminToken')})]);const messages=supportResult.status==='fulfilled'?(supportResult.value.messages||[]).filter(m=>m.sender_role==='customer'):[],records=cloudResult.status==='fulfilled'?(cloudResult.value.records||[]):[],incoming=[...messages.map(m=>({id:'message:'+String(m.id),title:'New customer message',body:String(m.customer_name||'Customer')+': '+String(m.message||'').slice(0,130)})),...records.map(r=>({id:'order:'+String(r.id),title:'New customer order',body:String(r.customerName||'Customer')+' submitted '+String(r.service||'a service order')}))];const key='allAdsAdminNoticeSeen';let seen=adminNoticeSeen;if(!adminNoticeStarted){const saved=JSON.parse(localStorage.getItem(key)||'[]');seen=new Set(saved.concat(incoming.map(x=>x.id)));adminNoticeSeen=seen;adminNoticeStarted=true;localStorage.setItem(key,JSON.stringify([...seen].slice(-200)));return;}const fresh=incoming.filter(x=>!seen.has(x.id));for(const x of fresh){alertAdminMessage(x.title,x.body);seen.add(x.id);}if(fresh.length)localStorage.setItem(key,JSON.stringify([...seen].slice(-200)));}catch(e){}}
function startAdminNotifications(){if(adminNoticeTimer)clearInterval(adminNoticeTimer);adminNoticeStarted=false;adminNoticeSeen=new Set();pollAdminNotifications();adminNoticeTimer=setInterval(pollAdminNotifications,15000);}

async function loadAdminRediShop(){const box=document.getElementById('adminRediShop');if(!box)return;box.innerHTML='<p class="muted">Loading social account supplier prices…</p>';try{const r=await fetch('/.netlify/functions/rediprofiles-catalogue',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Could not load Rediprofiles catalogue.');const rows=(d.services||[]).filter(x=>Number(x.supplier_price_ngn)>0&&x.is_active!==false&&x.in_stock!==false);box.innerHTML=rows.map(x=>'<article class="history-item"><strong>'+esc(x.name||'Social media account')+'</strong><p>Supplier price only: '+money(Number(x.supplier_price_ngn))+'</p><button class="btn" onclick="adminBuyRediAccount(\''+esc(String(x.id))+'\')">Buy at supplier price</button></article>').join('')||'<p class="muted">No supplier-priced accounts are currently available.</p>'}catch(e){box.innerHTML='<p class="muted">'+esc(e.message)+'</p>'}}
async function adminBuyRediAccount(serviceId){if(!confirm('Purchase this social media account at the supplier price using the Admin Wallet?'))return;try{const r=await fetch('/.netlify/functions/admin-rediprofiles-order-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btAdminToken'),service_id:serviceId})}),d=await r.json();if(!r.ok&&!d.pending)throw new Error(d.error||'Purchase failed.');toast(d.pending?'Supplier confirmation is pending. Do not repeat the purchase.':'Social account purchase submitted.');await admin()}catch(e){toast(e.message||'Admin social account purchase failed.')}}
async function adminRediprofilesOrders(){const box=document.getElementById('adminRediprofilesOrders');if(!box)return;box.innerHTML='<div class="payment-note">Loading account orders…</div>';try{const token=sessionStorage.getItem('btAdminToken')||'';const r=await fetch('/.netlify/functions/rediprofiles-order?admin=1&token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Could not load account orders.');const rows=Array.isArray(d.orders)?d.orders:[];box.innerHTML=rows.map(o=>{const details=o.account_data&&typeof o.account_data==='object'?JSON.stringify(o.account_data,null,2):'';return `<article class="history-item"><strong>${esc(o.customer_name||'Customer')} · ${esc(o.service_name)}</strong><p>Order: <b>${esc(o.external_customer_ref)}</b></p><p>Supplier ref: ${esc(o.supplier_order_id||'Pending')} · Status: <b>${esc(String(o.status).toUpperCase())}</b></p><p>Customer price: ${money(Number(o.customer_price||0))} · Supplier cost: ${money(Number(o.supplier_price||0))}</p><div class="muted">${new Date(o.created_at).toLocaleString()}</div>${details?`<details><summary>View delivered account details</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(details)}</pre></details>`:''}</article>`;}).join('')||'<div class="empty">No ready-made account orders yet.</div>';}catch(e){box.innerHTML='<div class="payment-note">'+esc(e.message||'Could not load account orders.')+'</div>';}}

document.addEventListener('DOMContentLoaded',()=>{const removeBadge=()=>document.querySelectorAll('a,div,iframe').forEach(el=>{const t=(el.innerText||el.getAttribute('aria-label')||'').trim();if(/powered by netlify/i.test(t)&&t.length<100)el.remove();});removeBadge();new MutationObserver(removeBadge).observe(document.body,{childList:true,subtree:true});});
