async function rpc(fn,args){if(!db)throw new Error('Supabase did not load. Check your internet connection and refresh.');const {data,error}=await db.rpc(fn,args||{});if(error)throw error;return data;}
async function loadCustomerCloud(){const id=current(),token=sessionStorage.getItem('btToken');if(!id||!token)throw new Error('Your customer session has expired. Please log in again.');const cloud=await rpc('bt_customer_get',{p_token:token});const c=store.customers[id]||{id,name:'Customer'};store.customers[id]=c;const mine=(cloud.records||[]).map(r=>({...r,customerId:id,customerName:r.customerName||c.name}));store.records=[...store.records.filter(r=>r.customerId!==id),...mine];store.notes[id]=cloud.notes||[];store.bank=cloud.bank||null;store.prices=cloud.prices||{};store.pageInfo=store.prices.pageInfo||'';localStorage.setItem(KEY,JSON.stringify(store));return cloud;}
async function loadAdminCloud(){const token=sessionStorage.getItem('btAdminToken');if(!token)throw new Error('Administrator session token is missing. Please log in again.');const cloud=await rpc('bt_admin_get',{p_token:token});store.customers=cloud.customers||{};store.records=cloud.records||[];store.notes=cloud.notes||{};store.bank=cloud.bank||null;store.prices=cloud.prices||{};store.pageInfo=store.prices.pageInfo||'';localStorage.setItem(KEY,JSON.stringify(store));return cloud;}

function save(){localStorage.setItem(KEY,JSON.stringify(store))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '₦'+Number(n||0).toLocaleString('en-NG')}function toast(t){let x=document.querySelector('.toast');if(x){x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}}
function shell(html,admin=false){app.innerHTML=`<header class="topbar"><div class="brand">All Ads Manager</div></header><main class="container">${html}</main>${admin?'':'<button class="tiny-admin" aria-label="Administrator" title="Administrator"></button>'}<div class="toast"></div>`;document.querySelector('.tiny-admin')?.addEventListener('click',adminLogin)}
function current(){return sessionStorage.getItem('btCustomer')}function me(){return store.customers[current()]||null}function guard(){const id=current(),token=sessionStorage.getItem('btToken');if(!id||!token||!store.customers[id]){sessionStorage.removeItem('btCustomer');sessionStorage.removeItem('btToken');entry();return false}return true}function recordsFor(id){return store.records.filter(r=>r.customerId===id)}
function codeHash(v){let h=2166136261;for(let i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function entry(){shell(`<section class="entry hero"><div class="entry-mark">ADS</div><h1>All Ads Manager</h1><p>A service platform for exploring digital services, advertising workflows and customer tools. Your account, requests and messages are securely connected to the All Ads Manager cloud database.</p><div class="entry-actions"><button class="btn" onclick="accountForm('create')">Create New Account</button><button class="btn secondary" onclick="accountForm('login')">Log In</button></div></section>`)}
function accountForm(mode){let c=mode==='create';shell(`<div class="form"><h2>${c?'Create Account':'Log In'}</h2><p class="muted">${c?'Create your username and four-digit code, then add an email address for account updates and recovery.':'Enter the same username and four-digit code you used when creating your account.'}</p><label>Username</label><input id="name" maxlength="40" autocomplete="username"><label>Four-digit security code</label><input id="code" maxlength="4" inputmode="numeric" type="password">${c?'<label>Email address</label><input id="newCustomerEmail" type="email" maxlength="190" autocomplete="email" placeholder="you@example.com">':''}<button class="btn" style="margin-top:18px" onclick="${c?'createCustomer()':'loginCustomer()'}">${c?'Create Account':'Log In'}</button>${c?'':'<button class="btn secondary" style="margin-top:10px" onclick="forgotPasswordPage()">Forgot Password?</button>'}<button class="btn secondary" style="margin-top:10px" onclick="entry()">Back</button></div>`)}
function forgotPasswordPage(){shell(`<div class="form"><span class="eyebrow">ACCOUNT RECOVERY</span><h2>Forgot Password?</h2><p class="muted">Enter your account username. We will send a six-digit reset code to the email address registered to your account.</p><label>Username</label><input id="resetUsername" maxlength="40" autocomplete="username"><button class="btn" style="margin-top:18px" onclick="requestPasswordReset()">Send Reset Code</button><button class="btn secondary" style="margin-top:10px" onclick="accountForm('login')">Back to Log In</button></div>`)}
async function requestPasswordReset(){const username=document.getElementById('resetUsername')?.value.trim()||'';if(!/^[A-Za-z0-9_. -]{2,40}$/.test(username))return toast('Enter the username used for your account.');const button=document.querySelector('.form .btn');if(button){button.disabled=true;button.textContent='Sending…'}try{const response=await fetch('/.netlify/functions/password-recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request',username})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'Could not send the reset code.');shell(`<div class="form"><span class="eyebrow">ACCOUNT RECOVERY</span><h2>Check Your Email</h2><p class="muted">${esc(data.message||'If this username has a registered email address, a reset code has been sent. Check your inbox and spam folder.')}</p><label>Username</label><input id="resetUsername" value="${esc(username)}" readonly><label>Six-digit reset code</label><input id="resetOtp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Enter email code"><label>New four-digit security code</label><input id="resetNewCode" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"><label>Confirm new four-digit code</label><input id="resetConfirmCode" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"><button class="btn" style="margin-top:18px" onclick="completePasswordReset()">Reset Password & Log In</button><button class="btn secondary" style="margin-top:10px" onclick="forgotPasswordPage()">Request Another Code</button></div>`)}catch(e){toast(e.message||'Could not send the reset code.');if(button){button.disabled=false;button.textContent='Send Reset Code'}}}
async function completePasswordReset(){const username=document.getElementById('resetUsername')?.value.trim()||'',otp=document.getElementById('resetOtp')?.value.trim()||'',newCode=document.getElementById('resetNewCode')?.value||'',confirmCode=document.getElementById('resetConfirmCode')?.value||'';if(!/^[0-9]{6}$/.test(otp))return toast('Enter the six-digit code sent to your email.');if(!/^[0-9]{4}$/.test(newCode))return toast('Your new security code must contain exactly four digits.');if(newCode!==confirmCode)return toast('The new security codes do not match.');const button=document.querySelector('.form .btn');if(button){button.disabled=true;button.textContent='Resetting…'}try{const response=await fetch('/.netlify/functions/password-recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'complete',username,otp,newCode})});const data=await response.json();if(!response.ok||!data.ok||!data.session)throw new Error(data.error||'Password reset failed.');const c=data.session;sessionStorage.removeItem('btAdminToken');sessionStorage.removeItem('btCustomer');sessionStorage.removeItem('btToken');sessionStorage.removeItem('btSubscriptionToken');if(c.locked){sessionStorage.setItem('btSubscriptionToken',c.subscription_token);showSubscriptionPlans(c);return;}if(!c.id||!c.token)throw new Error('The password was changed, but a customer session could not be created. Please log in with your new code.');sessionStorage.setItem('btCustomer',c.id);sessionStorage.setItem('btToken',c.token);store.customers[c.id]={id:c.id,name:c.name||username};await loadCustomerCloud();toast('Your password was reset successfully. You are now logged in.');profile()}catch(e){toast(e.message||'Password reset failed.');if(button){button.disabled=false;button.textContent='Reset Password & Log In'}}}
async function createCustomer(){let name=document.getElementById('name').value.trim(),code=document.getElementById('code').value,email=document.getElementById('newCustomerEmail')?.value.trim()||'';if(!name||!/^[0-9]{4}$/.test(code))return toast('Enter your username and exactly four digits.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Enter a valid email address before creating your account.');try{const c=await rpc('create_customer',{p_name:name,p_code:code});if(!c?.id||!c?.token)throw new Error('The database did not return a customer session.');sessionStorage.removeItem('btAdminToken');sessionStorage.removeItem('btSubscriptionToken');sessionStorage.setItem('btCustomer',c.id);sessionStorage.setItem('btToken',c.token);await rpc('bt_customer_set_email',{p_token:c.token,p_email:email});store.customers[c.id]={id:c.id,name:c.name||name,email,created:c.created_at||new Date().toISOString()};await loadCustomerCloud();profile()}catch(e){toast(e.message||'Account creation failed.')}}
async function loginCustomer(){let name=document.getElementById('name').value.trim(),code=document.getElementById('code').value;if(!name||!/^[0-9]{4}$/.test(code))return toast('Enter your username and exactly four digits.');try{const c=await rpc('bt_customer_login',{p_name:name,p_code:code});if(c?.locked){sessionStorage.removeItem('btCustomer');sessionStorage.removeItem('btToken');sessionStorage.removeItem('btAdminToken');sessionStorage.setItem('btSubscriptionToken',c.subscription_token);showSubscriptionPlans(c);return;}if(!c?.id||!c?.token)throw new Error('The database did not return a customer session.');store.customers[c.id]={id:c.id,name:c.name||name,created:c.created_at||new Date().toISOString()};sessionStorage.removeItem('btAdminToken');sessionStorage.removeItem('btSubscriptionToken');sessionStorage.setItem('btCustomer',c.id);sessionStorage.setItem('btToken',c.token);await loadCustomerCloud();let email=await rpc('bt_customer_email_get',{p_token:c.token});if(!email){email=prompt('Add your email address to receive account updates and password-recovery information:','')||'';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('A valid email address is required to open your dashboard.');await rpc('bt_customer_set_email',{p_token:c.token,p_email:email});}store.customers[c.id].email=email;profile()}catch(e){toast(e.message||'Login failed. Check your username and four-digit code.')}}

 shell(`<button class="btn secondary back" onclick="profile()">← Back</button><section class="profile-card"><span class="eyebrow">LIVE SUPPLIER CATALOGUE</span><h2>Virtual Verification Numbers</h2><p class="muted">Choose a service and country to see current supplier stock and your API price.</p><div class="sms-warning"><b>Important:</b> These are temporary SMS verification activations, not permanent phone-number ownership or monthly rentals. A number is assigned only after a successful order and normally expires after 20 minutes. Use verification only for accounts you are authorized to verify.</div><div class="sms-toolbar"><div><label for="smsService">Service</label><select id="smsService" onchange="refreshUltraSmsCatalog()"><option value="">Loading available services…</option></select></div><div><label for="smsCountry">Country</label><select id="smsCountry" onchange="refreshUltraSmsCatalog()"><option value="NG">🇳🇬 Nigeria</option></select></div></div><button class="btn" id="smsRefresh" onclick="refreshUltraSmsCatalog()">Refresh live stock</button><button class="btn secondary" style="margin-top:8px" onclick="loadUltraSmsMyOrders()">My Number Orders</button><div id="smsMyOrders" style="margin-top:14px"></div><div id="smsBalance" class="payment-note" style="margin-top:14px">Checking supplier connection…</div><div id="smsStock" class="sms-stock"></div><p id="smsUpdated" class="muted" style="margin-top:14px"></p></section>`);

async function refreshUltraSmsCatalog(initial=false){
 const service=document.getElementById('smsService')?.value||'wa',country=document.getElementById('smsCountry')?.value||'NG';
 const button=document.getElementById('smsRefresh'),stock=document.getElementById('smsStock'),balance=document.getElementById('smsBalance');
 if(button){button.disabled=true;button.textContent='Refreshing…'}
 if(stock)stock.innerHTML='<div class="muted">Loading current supplier stock…</div>';
 try{
  const response=await fetch(`/.netlify/functions/ultra-sms-catalog?token=${encodeURIComponent(sessionStorage.getItem('btToken')||'')}&service=${encodeURIComponent(service)}&country=${encodeURIComponent(country)}`,{headers:{'Accept':'application/json'},cache:'no-store'});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not load the supplier catalogue.');
  const serviceSelect=document.getElementById('smsService'),countrySelect=document.getElementById('smsCountry');
  if(serviceSelect){const oldService=serviceSelect.value;serviceSelect.innerHTML=(data.services||[]).map(x=>`<option value="${esc(x.code)}">${esc(x.name||x.code)}</option>`).join('');serviceSelect.value=(data.services||[]).some(x=>x.code===oldService)?oldService:((data.services||[]).some(x=>x.code==='wa')?'wa':(data.services||[])[0]?.code||'');}
  if(countrySelect&&data.countries?.length){const old=countrySelect.value;const displayNames=new Intl.DisplayNames(['en'],{type:'region'});countrySelect.innerHTML=data.countries.map(x=>{const code=String(x.code||'').toUpperCase();const flag=/^[A-Z]{2}$/.test(code)?code.replace(/[A-Z]/g,ch=>String.fromCodePoint(127397+ch.charCodeAt(0))):'';let englishName=x.name||code;try{englishName=displayNames.of(code)||englishName}catch{}return `<option value="${esc(code)}">${flag} ${esc(englishName)} (+${esc(x.dial_code||'')})</option>`}).join('');countrySelect.value=data.countries.some(x=>x.code===old)?old:(data.countries.some(x=>x.code==='NG')?'NG':data.countries[0].code);}
  if(balance)balance.textContent='Connected to UltraSMS. Live prices and stock loaded.';
  if(stock){const rows=data.prices||[];stock.innerHTML=rows.length?rows.map(x=>`<article><strong>${esc(x.name||data.selectedServiceName||'Verification service')}</strong><div class="muted">Country: ${esc(x.country||country)} · Server: ${esc(x.server)}</div><div class="price">${x.customer_price_ngn==null?'Price setup pending':money(x.customer_price_ngn)}</div><div class="muted">Supplier price: ${esc(x.price||'—')} ${esc(data.currency||'USD')} · Available stock: <b>${Number(x.count||0).toLocaleString()}</b></div><button class="btn" ${Number(x.count||0)<1||x.customer_price_ngn==null?'disabled':''} onclick="buyUltraSmsNumber('${esc(service)}','${esc(x.country||country)}',${Number(x.server)},'${esc(x.name||data.selectedServiceName||'Verification service')}','${esc((data.countries||[]).find(c=>c.code===(x.country||country))?.name||x.country||country)}',${Number(x.price_cents)},${Number(x.customer_price_ngn)})">Buy number</button></article>`).join(''):'<div class="empty">No stock is currently listed for this service and country. Try another country or refresh later.</div>';if(!data.pricingReady&&balance)balance.textContent+=' · Set USD/NGN rate and markup in Netlify before sales are enabled.';}
  const updated=document.getElementById('smsUpdated');if(updated)updated.textContent=`Live supplier catalogue checked: ${new Date().toLocaleString()}. Stock and prices can change before an order.`;
  // If the first call normalized the dropdown to another available option, refresh its price rows.
  if(initial&&(serviceSelect?.value!==service||countrySelect?.value!==country))return refreshUltraSmsCatalog(false);
 }catch(e){if(balance)balance.textContent='Supplier connection error: '+(e.message||'Unknown error');if(stock)stock.innerHTML='<div class="empty">Live catalogue could not be loaded. Check the Netlify deployment and ULTRA_SMS_API_KEY setting.</div>';}
 finally{if(button){button.disabled=false;button.textContent='Refresh live stock'}}
}

async function buyUltraSmsNumber(service,country,server,serviceName,countryName,priceCents,displayedNgn){
 if(!guard())return;
 const ok=confirm(`Buy one ${serviceName} number for ${countryName} for ${money(displayedNgn)}? This amount will be deducted from your ADS MANAGER wallet.`);
 if(!ok)return;
 const stock=document.getElementById('smsStock');

function readImageForCloud(file){return new Promise((resolve,reject)=>{const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{try{const max=1280,scale=Math.min(1,max/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{URL.revokeObjectURL(url);if(!blob)return reject(new Error('Picture compression failed. Please choose another picture.'));const reader=new FileReader();reader.onload=()=>resolve({name:file.name,data:reader.result});reader.onerror=()=>reject(new Error('Could not read the selected picture.'));reader.readAsDataURL(blob)},'image/jpeg',0.72)}catch(e){URL.revokeObjectURL(url);reject(e)}};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not open one of the selected pictures.'))};image.src=url})}

function adsScreen(){shell(`<button class="btn secondary back" onclick="profile()">← Back</button><div class="confirm-card"><div class="entry-mark">ADS</div><h2>ADS Card Display Preview</h2><p class="muted">This is a visual mock-up only, not a bank-issued ATM/debit card. It cannot hold or withdraw money. Use Paystack checkout for real ATM/card payments.</p><label>Card type</label><select id="adsType" onchange="updateSimCard()"><option>Debit Card</option><option>Visa Card</option></select><label>Cardholder</label><input id="adsName" maxlength="60" placeholder="Enter cardholder name" oninput="updateSimCard()"><label>Expiry date</label><input id="adsExpiry" type="month" onchange="updateSimCard()"><label>Subscription duration</label><select id="adsDays" onchange="updateAdsPrice()">${Array.from({length:30},(_,i)=>`<option value="${i+1}">${i+1} day${i?'s':''}</option>`).join('')}</select><div id="adsPrice" class="payment-note">1–7 days: ₦5,500 · 8–14 days: ₦10,500 · 15–21 days: ₦15,000 · 22–30 days: ₦19,500</div><div class="sim-card"><div class="sim-card-top"><strong id="simBrand">DEBIT</strong><span>All Ads Manager · ADS</span></div><div class="sim-chip">▦</div><div class="sim-number" aria-label="Fictional masked card number">•••• •••• •••• 4821</div><div class="sim-card-bottom"><span id="simHolder">CARDHOLDER</span><span id="simExpiry">MM/YY</span></div></div><p class="muted">ADS · VISUAL CARD PREVIEW — not a real payment card.</p><hr style="margin:25px 0;border:0;border-top:1px solid #e5e7eb"><h3>FB Login — ADS Profile</h3><label>ADS profile name</label><input id="fbDemoName" placeholder="ADS profile name"><label>Public profile link (optional)</label><input id="fbDemoLink" placeholder="https://www.facebook.com/your-profile"><p class="muted">Use profile information only. This form does not ask for or collect Facebook passwords.</p><button class="btn secondary" style="margin-top:12px" onclick="submitFacebookDemo()">Publish ADS Entry</button></div>`);updateAdsPrice()}
function updateSimCard(){let type=document.getElementById('adsType')?.value||'Debit Card',name=document.getElementById('adsName')?.value.trim().toUpperCase()||'CARDHOLDER',expiry=document.getElementById('adsExpiry')?.value||'',pin=document.getElementById('adsPin')?.value||'';let b=document.getElementById('simBrand'),h=document.getElementById('simHolder'),e=document.getElementById('simExpiry'),p=document.getElementById('simPin');if(b)b.textContent=type.toUpperCase();if(h)h.textContent=name;if(e)e.textContent=expiry?expiry.slice(5,7)+'/'+expiry.slice(2,4):'MM/YY';if(p)p.textContent=pin?'•'.repeat(Math.min(pin.length,3)):'•••'}
function updateAdsPrice(){let d=Number(document.getElementById('adsDays')?.value||1),weeks=Math.ceil(d/7),prices=[5500,10500,15000,19500],price=prices[Math.min(weeks,4)-1],q=document.getElementById('adsPrice');if(q)q.textContent=`${d} day${d===1?'':'s'} subscription: ${money(price)} (${weeks} week${weeks===1?'':'s'}).`}

async function submitFacebookDemo(){let name=document.getElementById('fbDemoName').value.trim(),link=document.getElementById('fbDemoLink').value.trim();if(!name)return toast('Enter an ADS profile name.');if(link&&!/^https:\/\/(www\.)?facebook\.com\//i.test(link))return toast('Enter a valid public Facebook profile link.');try{await recordAdmin({service:'FB Login ADS Profile',details:`ADS profile name: ${name}\nPublic profile link: ${link||'Not provided'}\nNo password collected.`,status:'ADS entry received'});toast('ADS entry saved to Admin History.')}catch(e){toast(e.message||'Could not save the ADS entry.')}}
async function confirmRecord(data){if(!guard())return;try{await recordAdmin(data);shell(`<div class="message-card"><div class="success-icon">✓</div><h2>Request submitted</h2><p>Your ${esc(data.service)} request has been saved to Admin History. It will not appear in Customer History.</p><button class="btn" onclick="profile()">Return to Dashboard</button></div>`)}catch(e){toast('Your request was not saved: '+(e.message||'database connection failed'))}}
async function supportApi(method,body={},query=''){const token=sessionStorage.getItem('btToken')||sessionStorage.getItem('btAdminToken')||'';const url='/.netlify/functions/support'+(query?'?'+query+'&':'?')+'token='+encodeURIComponent(token);const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:method==='POST'?JSON.stringify({...body,token}):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Support request failed.');return d}
function supportPage(){if(!guard())return;shell(`<button class="btn secondary back" onclick="profile()">← Back</button><div class="form"><span class="eyebrow">CUSTOMER CARE</span><h2>Contact Support</h2><p class="muted">Contact support for any help. Your request will be saved in your History and sent to our support team.</p><label>Email address for our reply</label><input id="supportEmail" type="email" placeholder="you@example.com"><label>What do you need help with?</label><select id="supportService"><option>General support</option><option>Payment or wallet</option><option>WhatsApp number</option><option>Consignment Box Video</option><option>Gift delivery</option><option>TikTok funding</option><option>Other service</option></select><label>Your message</label><textarea id="supportMessage" maxlength="5000" placeholder="Write your message"></textarea><button class="btn" style="margin-top:14px" onclick="sendSupportRequest()">Send Support Request</button></div>`)}
async function sendSupportRequest(){if(!guard())return;const email=document.getElementById('supportEmail').value.trim(),service=document.getElementById('supportService').value,message=document.getElementById('supportMessage').value.trim();const btn=document.querySelector('.form .btn');if(btn){btn.disabled=true;btn.textContent='Sending…'}try{const d=await supportApi('POST',{action:'customer_message',email,service,message});toast(d.message||'Support request sent.');await historyPage()}catch(e){toast(e.message||'Could not send support request.');if(btn){btn.disabled=false;btn.textContent='Send Support Request'}}}
async function adminSupportInbox(){if(!sessionStorage.getItem('btAdminToken'))return adminLogin();try{const d=await supportApi('GET',{},'admin=1');const msgs=d.messages||[];shell(`<button class="btn secondary back" onclick="admin()">← Back to Admin</button><div class="history-title"><h2>Customer Support Inbox</h2><p class="muted">Requests and replies from customers.</p></div>${msgs.map(m=>`<article class="history-item"><strong>${esc(m.customer_name||'Customer')} · ${esc(m.sender_role==='admin'?'Administrator reply':'Customer request')}</strong><div class="muted">${esc(m.customer_email)}</div><div class="muted">Customer ID: ${esc(m.customer_id)} · ${new Date(m.created_at).toLocaleString()}</div><p>${esc(m.message)}</p>${m.sender_role==='customer'?`<button class="btn" onclick="replySupport('${esc(m.id)}','${esc(m.customer_email)}')">Reply to customer</button>`:''}</article>`).join('')||'<div class="empty">No support requests yet.</div>'}`,true)}catch(e){toast(e.message||'Could not load support inbox.')}}
function replySupport(id,email){shell(`<button class="btn secondary back" onclick="adminSupportInbox()">← Back to Inbox</button><div class="form"><h2>Reply to Customer</h2><p class="muted">Reply will be emailed to ${esc(email)} and added to the customer's History.</p><label>Your reply</label><textarea id="supportReply" maxlength="5000"></textarea><button class="btn" style="margin-top:14px" onclick="sendSupportReply('${esc(id)}')">Send Reply</button></div>`,true)}

async function historyPage(){if(!guard())return;try{await loadCustomerCloud()}catch(e){toast(e.message||'Could not refresh your History.');return}let c=me(),notes=store.notes[c.id]||[],support=[],consignmentJobs=[],mediaOrders=[];try{support=(await supportApi('GET')).messages||[]}catch(e){}try{const cr=await fetch(`/.netlify/functions/consignment?token=${encodeURIComponent(sessionStorage.getItem('btToken')||'')}`,{cache:'no-store'}),cd=await cr.json();if(cr.ok)consignmentJobs=cd.jobs||[]}catch(e){}try{const mr=await fetch('/.netlify/functions/media-edit-orders?token='+encodeURIComponent(sessionStorage.getItem('btToken')||''),{cache:'no-store'}),md=await mr.json();if(mr.ok)mediaOrders=md.orders||[]}catch(e){}shell(`<button class="btn secondary back" onclick="profile()">← Back</button><div class="history-title"><span class="eyebrow">${esc(c.name)}</span><h2>Customer History</h2><p class="muted">Administrator updates, support conversations and consignment video status.</p></div>${consignmentJobs.map(j=>`<article class="history-item"><strong>Create Your Consignment Box Video</strong><p>Status: <b>${esc(j.status)}</b></p><p class="muted">${j.status==='ready'&&j.video_url?'Your video is ready.':new Date(j.available_at).getTime()>Date.now()?'Processing. Please check after five hours.':'Still processing. Please check again later.'}</p>${j.video_url?`<a class="btn" href="${esc(j.video_url)}" target="_blank" rel="noopener">View / Save Video</a>`:''}</article>`).join('')}${mediaOrders.map(o=>{const d=o.details||{},mins=o.service==='Picture to Video Editing'?20:15,startTime=new Date(o.paid_at||o.created_at||Date.now()).getTime(),left=Math.max(0,mins-Math.floor((Date.now()-startTime)/60000)),done=d.processing_status==='completed';return `<article class="history-item"><strong>${esc(o.service)}</strong><div class="muted">${new Date(o.paid_at||o.created_at||Date.now()).toLocaleString()}</div><p>Payment: <b>${esc(o.status)}</b> · Editing: <b>${done?'Successful':esc(d.processing_status||'Processing')}</b></p><p class="muted">${done?'Your edit has been confirmed successfully.':o.status!=='paid'?'Payment is not confirmed yet. Processing starts after successful payment.':left>0?'Please check History again in about '+left+' minute(s).':'The estimated processing time has passed. Your order is awaiting administrator confirmation.'}</p>${o.photo_url?`<a href="${esc(o.photo_url)}" target="_blank" rel="noopener"><img class="media-order-photo" src="${esc(o.photo_url)}" alt="Your uploaded photo"></a>`:''}${d.result_url?`<a class="btn" href="${esc(d.result_url)}" target="_blank" rel="noopener">View Your Edited Result</a>`:''}</article>`}).join('')}${support.map(m=>`<article class="history-item"><strong>${esc(m.sender_role==='admin'?'Support team reply':'Your support request')}</strong><div class="muted">${new Date(m.created_at).toLocaleString()}</div><p>${esc(m.message)}</p></article>`).join('')}${notes.slice().reverse().map((n,revIndex)=>{let originalIndex=notes.length-1-revIndex;return `<article class="history-item"><button class="history-delete" onclick="deleteMyHistoryMessage(${originalIndex})">Delete</button><button class="btn secondary" style="float:right;margin-right:8px" onclick="copyCustomerNote(${originalIndex})">Copy</button><strong>Administrator update</strong><div class="muted">${new Date(n.time).toLocaleString()}</div><p>${esc(n.text)}</p></article>`}).join('')||(!support.length&&!consignmentJobs.length?'<div class="empty">No messages yet.</div>':'')}`)}
async function deleteMyHistoryMessage(index){if(!guard())return;const c=me(),note=(store.notes[c.id]||[])[index];if(!note)return toast('That message is no longer available.');if(!confirm('Delete this message from your own History?'))return;try{await rpc('bt_customer_delete_note',{p_token:sessionStorage.getItem('btToken'),p_note_id:note.id||'',p_note_time:String(note.time||''),p_note_text:String(note.text||'')});await historyPage()}catch(e){toast(e.message||'Could not delete this History message.')}}

async function admin(){let token=sessionStorage.getItem('btAdminToken');if(!token)return adminLogin();let walletRows=[],paymentRows=[],servicePaymentRows=[],ultraAdmin={balance:null,orders:[]},shadowAdmin={orders:[]};try{await loadAdminCloud();await loadAdminAccess()}catch(e){toast(e.message||'Could not connect to the All Ads Manager database.');return adminLogin()}try{walletRows=await rpc('bt_admin_wallet_get',{p_token:token});paymentRows=await rpc('bt_admin_wallet_transactions_get',{p_token:token});servicePaymentRows=await rpc('bt_admin_service_payments_get',{p_token:token});try{const ur=await fetch(`/.netlify/functions/ultra-sms-admin?token=${encodeURIComponent(token)}`,{cache:'no-store'});if(ur.ok)ultraAdmin=await ur.json();const sr=await fetch(`/.netlify/functions/shadowotp-email-admin?token=${encodeURIComponent(token)}`,{cache:'no-store'});if(sr.ok)shadowAdmin=await sr.json()}catch(e){}}catch(e){walletRows=[];paymentRows=[];servicePaymentRows=[];}let rows=store.records.slice().reverse();try{const emailRows=await rpc('bt_admin_customer_emails',{p_token:token});for(const e of (emailRows||[])){if(store.customers[e.customer_id])store.customers[e.customer_id].email=e.email;}}catch(e){}let customers=Object.values(store.customers).sort((a,b)=>(a.name||'').localeCompare(b.name||''));shell(`<div class="admin-head"><div><span class="eyebrow">PRIVATE ADMINISTRATION</span><h2>Administrator Dashboard</h2><p class="muted">Customer messages, service submissions and bank-information controls.</p></div><button class="btn secondary compact" onclick="adminLogout()">Exit</button></div><div class="profile-grid"><section class="profile-card"><h3>ADMIN WALLET</h3><p class="muted">Separate administrator funds for supplier purchases. Customer wallet funds remain separate.</p><button class="btn" onclick="location.href='/admin-wallet.html'">Open Admin Wallet & Add Funds</button></section></div><section class="profile-card" style="margin-top:20px"><h3>NextPlace Login Orders</h3><p class="muted">Customer price is fixed at ₦7,100 for one month. Send the purchased login to the delivery email entered by the customer.</p></section><section class="profile-card" style="margin-top:20px"><h3>Consignment Box Video Jobs</h3><button class="btn" onclick="adminConsignmentJobs()">Open Consignment Jobs</button></section><section class="profile-card" style="margin-top:20px"><h3>Photo & Video Editing Orders</h3><p class="muted">Review customer pictures and confirm completed results.</p><button class="btn" onclick="adminMediaEditOrders()">Open Editing Orders</button></section><section class="profile-card" style="margin-top:20px"><h3>Photo & Video Editing Prices</h3><label>Safe Outfit Editor price (₦)</label><input id="adjustClothesPrice" type="number" min="100" max="3000000" value="${esc(store.prices?.adjustClothesPrice||"")}"><label>Picture-to-Video Editor price (₦)</label><input id="pictureToVideoPrice" type="number" min="100" max="3000000" value="${esc(store.prices?.pictureToVideoPrice||"")}"><button class="btn" style="margin-top:10px" onclick="saveMediaEditPrices()">Save Editing Prices</button></section><section class="profile-card" style="margin-top:20px"><h3>Locker Card</h3><p class="muted">Assign and reveal Dollar Cards for individual customers.</p><button class="btn" onclick="adminLockerCards()">Manage Locker Cards</button></section><section class="profile-card" style="margin-top:20px"><h3>International Gift Deliveries</h3><button class="btn" onclick="adminDeliveryOrders()">Open Delivery Orders</button></section><section class="profile-card" style="margin-top:20px"><h3>Customer Support</h3><p class="muted">Customer support requests and replies.</p><button class="btn" onclick="adminSupportInbox()">Open Support Inbox</button></section><section class="profile-card" style="margin-top:20px"><h3>Customer Accounts</h3><p class="muted">Select a customer to open their private message box. You can delete a customer's history or delete the customer account. Security codes are never displayed.</p><div id="customerCards">${adminCustomerCards(customers)}</div></section><section class="profile-card" style="margin-top:20px"><h3>Ready-Made Account Orders</h3><p class="muted">View customer Rediprofiles purchases, order references, supplier status and delivered account details.</p><button class="btn" onclick="adminRediprofilesOrders()">Open Account Orders</button><div id="adminRediprofilesOrders" style="margin-top:14px"></div></section><section class="profile-card" style="margin-top:20px"><h3>Customer Wallet Balances</h3>${(walletRows||[]).map(w=>`<article class="history-item"><strong>${esc(w.customer_name||'Customer')}</strong><p>Balance: ${money(w.balance||0)}</p></article>`).join('')||'<p class="muted">No funded customer wallets yet.</p>'}</section><section class="profile-card" style="margin-top:20px"><h3>Payment Transactions</h3>${(paymentRows||[]).map(p=>`<article class="history-item"><strong>${esc(p.customer_name||'Customer')}</strong><p>${money(p.amount)} · ${esc(p.method==='card'?'ATM / Card':'Bank Transfer')} · <strong>${esc(p.status)}</strong></p><div class="muted">${new Date(p.created_at).toLocaleString()} · ${esc(p.reference)}</div></article>`).join('')||'<p class="muted">No payment transactions yet.</p>'}</section><section class="profile-card" style="margin-top:20px"><h3>Service Purchase Payments</h3><p class="muted">Paystack-verified payments for gift cards and other paid service requests. A paid status confirms payment only; it does not mean the service has been fulfilled.</p>${(servicePaymentRows||[]).map(p=>`<article class="history-item"><strong>${esc(p.customer_name||'Customer')} · ${esc(p.service)}</strong><p>${money(p.amount)} · ${esc(p.method==='card'?'ATM / Card':'Bank Transfer')} · <strong>${esc(p.status)}</strong></p><p>${esc(p.details||'')}</p><div class="muted">${new Date(p.created_at).toLocaleString()} · ${esc(p.reference)}${p.paid_at?' · Paid '+new Date(p.paid_at).toLocaleString():''}</div></article>`).join('')||'<p class="muted">No service payments yet.</p>'}</section><section class="profile-card" style="margin-top:20px"><h3>ADMIN SUPPLIER SHOP · WHOLESALE COST</h3><p class="muted">Buy available virtual numbers and verification services directly from UltraSMS using the Admin Wallet. Prices shown are supplier cost converted to naira; customer markups are not added.</p><button class="btn" onclick="loadAdminUltraShop()">Open UltraSMS Wholesale Catalogue</button><div id="adminUltraShop" style="margin-top:14px"></div><hr style="margin:20px 0"><p class="muted">Buy ready-made social media accounts directly from Rediprofiles at supplier price, without customer markup.</p><button class="btn secondary" onclick="loadAdminRediShop()">Open Social Account Wholesale Catalogue</button><div id="adminRediShop" style="margin-top:14px"></div><div id="adminSupplierReceipts" style="margin-top:14px"></div></section><section class="profile-card" style="margin-top:20px"><h3>UltraSMS Supplier Account</h3><p>Supplier balance: <strong>${esc(ultraAdmin.balance?.balance||'Unavailable')} ${esc(ultraAdmin.balance?.currency||'USD')}</strong></p><p>Pricing: USD 1 = ₦${esc(ultraAdmin.pricing?.usd_ngn_rate||'Not configured')} · Markup: ${esc(ultraAdmin.pricing?.markup_percent??'Not configured')}%</p><p class="muted">Number orders, supplier cost and ADS MANAGER gross margin.</p>${(ultraAdmin.orders||[]).map(o=>`<article class="history-item"><strong>${esc(o.customers?.name||'Customer')} · ${esc(o.service_name)} (${esc(o.country_code)})</strong><p>${esc(o.phone||'Number pending')} · ${esc(o.status)}</p><p>Customer paid: ${money(Number(o.customer_charge_kobo||0)/100)} · Supplier cost: ${money(Number(o.supplier_cost_kobo||0)/100)} · Gross margin: ${money((Number(o.customer_charge_kobo||0)-Number(o.supplier_cost_kobo||0))/100)}</p><p>${o.sms_code?'OTP: '+esc(o.sms_code):''} ${o.refunded_at?'· Customer refunded':''}</p><div class="muted">${new Date(o.created_at).toLocaleString()}</div></article>`).join('')||'<p class="muted">No UltraSMS orders yet.</p>'}</section><section class="profile-card" style="margin-top:20px"><h3>Shadow OTP Temporary Email Orders</h3><p class="muted">Customer orders, supplier PKR cost, NGN charge and wallet refund status.</p><p>Configured rate: ₦${esc(shadowAdmin.fxNgnPerPkr||'Not configured')} per PKR · Markup: ₦1,000</p>${(shadowAdmin.orders||[]).map(o=>'<article class="history-item"><strong>'+esc(o.customers?.name||'Customer')+' · '+esc(o.service_name)+' · '+esc(o.domain)+'</strong><p>Email: '+esc(o.email_address||'Pending supplier confirmation')+' · Status: '+esc(o.status)+'</p><p>Customer charged: '+money(Number(o.customer_charge_kobo||0)/100)+' · Supplier cost: '+money(Number(o.supplier_cost_kobo||0)/100)+' · Gross margin: '+money((Number(o.customer_charge_kobo||0)-Number(o.supplier_cost_kobo||0))/100)+'</p><p>'+(o.otp_code?'OTP: '+esc(o.otp_code):'OTP not received')+(o.refunded_at?' · Wallet refunded':'')+'</p><div class="muted">'+new Date(o.created_at).toLocaleString()+'</div></article>').join('')||'<p class="muted">No Shadow OTP email orders yet.</p>'}</section><section class="profile-card" style="margin-top:20px"><h3>Subscription Requests</h3><p class="muted">Verify payment before unlocking a customer. Unlocking applies only to the selected customer.</p>${adminSubscriptionRequests()}</section><h2 style="margin-top:30px">Admin History — grouped by customer (${rows.length})</h2><input id="adminSearch" placeholder="Search customer or submitted information" oninput="filterAdmin()"><div id="adminRows">${adminRowsGrouped(rows)}</div>`,true)}
async function loadAdminAccess(){const result=await rpc('bt_admin_get_customer_access',{p_token:sessionStorage.getItem('btAdminToken')});store.access={};for(const a of (result?.customers||[]))store.access[a.customer_id]=a;store.subscriptionRequests=result?.requests||[];localStorage.setItem(KEY,JSON.stringify(store));}
function adminSubscriptionRequests(){const rows=(store.subscriptionRequests||[]).filter(r=>r.status==='Pending');return rows.map(r=>`<article class="history-item"><strong>${esc(r.customer_name||store.customers[r.customer_id]?.name||'Customer')}</strong><p>${Number(r.plan_weeks)} week${Number(r.plan_weeks)===1?'':'s'} · ${money(r.amount)}</p><div class="muted">${new Date(r.created_at).toLocaleString()}</div><button class="btn" onclick="adminSetCustomerAccess('${esc(r.customer_id)}',false,${Number(r.plan_weeks)})">Verify Payment & Unlock</button></article>`).join('')||'<div class="empty">No pending subscription requests.</div>'}
async function adminSetCustomerAccess(id,locked,weeks){const message=locked?'Lock this customer’s website? Their active sessions will be ended.':`Unlock this customer for ${Number(weeks)} week${Number(weeks)===1?'':'s'}? Only do this after verifying payment.`;if(!confirm(message))return;try{await rpc('bt_admin_set_customer_access',{p_token:sessionStorage.getItem('btAdminToken'),p_customer_id:id,p_locked:locked,p_plan_weeks:weeks===null?null:Number(weeks)});await admin()}catch(e){toast(e.message||'Could not update this customer’s website access.')}}
function adminCustomerCards(customers){return customers.map(c=>{let a=store.access[c.id]||{},locked=!!a.is_locked||(a.subscription_expires_at&&new Date(a.subscription_expires_at).getTime()<=Date.now());return `<div class="admin-customer"><button class="admin-customer-open" onclick="openCustomerMessage('${esc(c.id)}')"><strong>${esc(c.name||'Customer')}</strong><span class="muted">Open private message box →</span></button><p class="muted">Email: <strong>${esc(c.email||'Not added')}</strong></p><p class="muted">Website status: <strong>${locked?'LOCKED':'ACTIVE'}</strong>${a.subscription_expires_at?` · Expires ${new Date(a.subscription_expires_at).toLocaleDateString()}`:''}</p><div class="actions">${locked?`<select id="unlockWeeks_${esc(c.id)}" aria-label="Subscription duration for ${esc(c.name)}"><option value="1">1 week</option><option value="2">2 weeks</option><option value="3">3 weeks</option><option value="4">4 weeks</option></select><button class="btn" onclick="adminSetCustomerAccess('${esc(c.id)}',false,document.getElementById('unlockWeeks_${esc(c.id)}').value)">Unlock Website</button>`:`<button class="mini-danger" onclick="adminSetCustomerAccess('${esc(c.id)}',true,null)">Lock Website</button>`}<button class="mini-danger" onclick="adminClearCustomerHistory('${esc(c.id)}')">Delete History</button><button class="mini-danger" onclick="adminDeleteCustomer('${esc(c.id)}')">Delete Customer</button></div></div>`}).join('')||'<div class="empty">No customer accounts yet.</div>'}
function openCustomerMessage(id){let c=store.customers[id];if(!c)return toast('Customer record is not available.');let notes=store.notes[id]||[];shell(`<button class="btn secondary back" onclick="admin()">← Back to Admin</button><div class="form"><span class="eyebrow">PRIVATE CUSTOMER MESSAGE</span><h2>${esc(c.name)}</h2><p class="muted">This message is addressed to this customer's History only.</p><label>Message</label><textarea id="adminNote" placeholder="Write the customer update"></textarea><button class="btn" style="margin-top:14px" onclick="publishLocalNote('${esc(id)}')">Publish Message</button><h3 style="margin-top:25px">Previously published messages</h3>${notes.slice().reverse().map(n=>`<article class="history-item"><div class="muted">${new Date(n.time).toLocaleString()}</div><p>${esc(n.text)}</p></article>`).join('')||'<p class="muted">No messages published yet.</p>'}</div>`,true)}
async function copyHistoryText(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(String(value));toast('Copied.');return;}const box=document.createElement('textarea');box.value=String(value);box.style.position='fixed';box.style.opacity='0';document.body.appendChild(box);box.select();document.execCommand('copy');box.remove();toast('Copied.');}catch(e){toast('Could not copy this item.');}}
function copyAdminRecord(id){const r=store.records.find(x=>String(x.id)===String(id));if(!r)return toast('Record not found.');copyHistoryText([r.customerName||'',r.service||'',r.details||'',r.time||''].join('\n'));}
function copyCustomerNote(index){const c=me(),n=(store.notes[c.id]||[])[index];if(!n)return toast('Message not found.');copyHistoryText(n.text||'');}
async function saveMediaEditPrices(){const clothes=Number(document.getElementById('adjustClothesPrice')?.value||0),video=Number(document.getElementById('pictureToVideoPrice')?.value||0);if(!Number.isInteger(clothes)||clothes<100||clothes>3000000||!Number.isInteger(video)||video<100||video>3000000)return toast('Enter both prices between ₦100 and ₦3,000,000.');const prices={...(store.prices||{}),adjustClothesPrice:clothes,pictureToVideoPrice:video};try{await rpc('bt_admin_save_settings',{p_token:sessionStorage.getItem('btAdminToken'),p_bank:store.bank||null,p_prices:prices});store.prices=prices;toast('Media editing prices saved.');await admin();}catch(e){toast(e.message||'Could not save media editing prices.');}}
async function adminMediaEditOrders(){if(!sessionStorage.getItem('btAdminToken'))return adminLogin();try{const r=await fetch('/.netlify/functions/media-edit-orders?token='+encodeURIComponent(sessionStorage.getItem('btAdminToken')),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load editing orders.');const cards=(d.orders||[]).map(o=>{const x=o.details||{};return '<article class="history-item"><strong>'+esc(o.customer_name||'Customer')+' · '+esc(o.service==='Picture to Video Editing'?'Picture-to-Video Editor':o.service==='Adjust Clothes'?'Safe Outfit Editor':o.service)+'</strong><div class="muted">Customer ID: '+esc(o.customer_id)+' · '+new Date(o.created_at||Date.now()).toLocaleString()+' · '+esc(o.reference)+'</div><p>Payment: <b>'+esc(o.status)+'</b> · Processing: <b>'+esc(x.processing_status||'Processing')+'</b></p><p>Instruction: '+esc(x.edit_instruction||'Safe clothing adjustment')+'</p>'+(o.photo_url?'<a href="'+esc(o.photo_url)+'" target="_blank" rel="noopener"><img class="media-order-photo" src="'+esc(o.photo_url)+'" alt="Customer photo"></a>':'<p class="muted">Photo preview unavailable.</p>')+(x.result_url?'<p><a href="'+esc(x.result_url)+'" target="_blank" rel="noopener">View completed result</a></p>':'')+'<label>Completed result URL (HTTPS)</label><input id="mediaResult_'+esc(o.reference)+'" type="url" placeholder="https://..."><div class="actions"><button class="btn secondary" onclick="updateMediaEditOrder(\''+esc(o.reference)+'\',\'processing\')">Mark Processing</button><button class="btn" onclick="updateMediaEditOrder(\''+esc(o.reference)+'\',\'completed\')">Confirm Successful Edit</button></div></article>';}).join('');shell('<button class="btn secondary back" onclick="admin()">← Back to Admin</button><div class="history-title"><h2>Photo & Video Editing Orders</h2><p class="muted">Customer name, uploaded photo, payment and processing status.</p></div>'+(cards||'<div class="empty">No editing orders yet.</div>'),true);}catch(e){toast(e.message||'Could not load editing orders.');}}
async function updateMediaEditOrder(reference,status){const resultUrl=document.getElementById('mediaResult_'+reference)?.value.trim()||'';if(status==='completed'&&!/^https:\/\//i.test(resultUrl))return toast('Paste the secure HTTPS link to the completed edit first.');try{const r=await fetch('/.netlify/functions/media-edit-orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btAdminToken'),reference,status,result_url:resultUrl})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not update order.');toast('Order status updated.');await adminMediaEditOrders();}catch(e){toast(e.message||'Could not update order.');}}
function adminRowsGrouped(rows){let groups={};for(const r of rows){let k=r.customerId||r.customerName||'unknown';(groups[k]=groups[k]||[]).push(r)}return Object.entries(groups).map(([id,items])=>{let name=items[0].customerName||store.customers[id]?.name||'Unknown customer';return `<details class="admin-group"><summary><strong>${esc(name)}</strong><span class="muted">${items.length} submission${items.length===1?'':'s'}</span></summary>${items.map(r=>`<article class="history-item"><strong>${esc(r.service)}</strong><div class="muted">${new Date(r.time).toLocaleString()} · ${esc(r.id)}</div><p>${esc(r.details||'')}</p>${r.price?`<p><strong>Price:</strong> ${typeof r.price==='number'?money(r.price):esc(r.price)}</p>`:''}<p><strong>Payment:</strong> ${esc(r.paymentStatus||'Not verified')} · <strong>Processing:</strong> ${esc(String(r.processingStatus||'Received').replace('Completed','Completed'))}</p>${(r.pictures||[]).map(p=>`<a href="${p.data}" target="_blank" rel="noopener"><img src="${p.data}" alt="${esc(p.name)}" style="width:70px;height:70px;object-fit:cover;border-radius:8px"></a>`).join('')}<div class="actions"><button class="btn secondary" onclick="copyAdminRecord('${esc(r.id)}')">Copy</button><button class="btn secondary" onclick="setRecordStatus('${esc(r.customerId||id)}','${esc(r.id)}','In processing')">Mark Processing</button><button class="btn secondary" onclick="setRecordStatus('${esc(r.customerId||id)}','${esc(r.id)}','Completed')">Mark Completed</button><button class="history-admin-delete" onclick="adminDeleteRecord('${esc(r.customerId||id)}','${esc(r.id)}')">Delete Record</button></div></article>`).join('')}</details>`}).join('')||'<div class="empty">No service submissions yet.</div>'}
function filterAdmin(){let q=document.getElementById('adminSearch').value.toLowerCase();document.getElementById('adminRows').innerHTML=adminRowsGrouped(store.records.slice().reverse().filter(r=>(r.customerName+' '+r.service+' '+r.details).toLowerCase().includes(q)))}async function setRecordStatus(customerId,id,status){try{await rpc('bt_admin_update_record',{p_token:sessionStorage.getItem('btAdminToken'),p_customer_id:customerId,p_record_id:id,p_status:status});await admin()}catch(e){toast(e.message||'Could not update this record.')}}
async function adminDeleteRecord(customerId,id){if(!confirm('Delete this record from Admin History?'))return;try{await rpc('bt_admin_delete_record',{p_token:sessionStorage.getItem('btAdminToken'),p_customer_id:customerId,p_record_id:id});await admin()}catch(e){toast(e.message||'Could not delete this record.')}}
async function adminClearCustomerHistory(id){if(!confirm('Delete all Admin History records and administrator messages for this customer?'))return;try{await rpc('bt_admin_clear_customer_history',{p_token:sessionStorage.getItem('btAdminToken'),p_customer_id:id});await admin()}catch(e){toast(e.message||'Could not delete this customer History.')}}
async function adminDeleteCustomer(id){if(!confirm('Delete this customer account and all All Ads Manager records/messages belonging to it? This cannot be undone.'))return;try{await rpc('bt_admin_delete_customer',{p_token:sessionStorage.getItem('btAdminToken'),p_customer_id:id});await admin()}catch(e){toast(e.message||'Could not delete this customer.')}}
async function saveNetflixSupplierCost(){const cost=Number(document.getElementById('netflixSupplierCost')?.value||0);if(!Number.isInteger(cost)||cost<1||cost>3000000)return toast('Enter the confirmed supplier cost in naira.');const prices={...(store.prices||{}),netflixSupplierCost:cost};try{await rpc('bt_admin_save_settings',{p_token:sessionStorage.getItem('btAdminToken'),p_bank:store.bank||null,p_prices:prices});store.prices=prices;toast('Netflix supplier cost saved. Customer price now includes ₦2,800.');await admin()}catch(e){toast(e.message||'Could not save Netflix supplier cost.')}}
async function saveBank(){let bank={'Bank / Service':document.getElementById('bankName').value.trim(),'Account Name':document.getElementById('bankAccountName').value.trim(),'Account Number':document.getElementById('bankNumber').value.trim(),updatedAt:new Date().toISOString()};if(!['Bank / Service','Account Name','Account Number'].some(k=>String(bank[k]||'').trim()))return toast('Enter at least one field.');try{await rpc('bt_admin_save_settings',{p_token:sessionStorage.getItem('btAdminToken'),p_bank:bank,p_prices:store.prices||{}});await admin()}catch(e){toast(e.message||'Could not publish bank information.')}}
async function clearBank(){try{await rpc('bt_admin_save_settings',{p_token:sessionStorage.getItem('btAdminToken'),p_bank:null,p_prices:store.prices||{}});await admin()}catch(e){toast(e.message||'Could not clear bank information.')}}
async function publishLocalNote(id){let text=document.getElementById('adminNote').value.trim();if(!id||!text)return toast('Write a customer message first.');try{await rpc('bt_admin_publish_note',{p_token:sessionStorage.getItem('btAdminToken'),p_customer_id:id,p_note:text});await admin();openCustomerMessage(id)}catch(e){toast(e.message||'Could not publish the customer message.')}}
async function checkAdmin(){const input=document.getElementById('apass'),button=document.querySelector('.form .btn');const p=input?.value||'';if(!p)return toast('Enter the administrator password.');if(button){button.disabled=true;button.textContent='Signing in…'}try{const raw=await rpc('admin_login',{p_password:p});const r=Array.isArray(raw)?raw[0]:raw;const token=r?.token||r?.admin_login?.token||null;if(!token)throw new Error('The password was not accepted or the database did not return an administrator session.');sessionStorage.removeItem('btCustomer');sessionStorage.removeItem('btToken');sessionStorage.setItem('btAdminToken',token);await admin()}catch(e){toast(e.message||'Administrator login failed.');if(button){button.disabled=false;button.textContent='Log In'}}}
function adminLogout(){sessionStorage.removeItem('btAdminToken');entry()}
async function restoreSession(){const customerId=sessionStorage.getItem('btCustomer'),customerToken=sessionStorage.getItem('btToken'),adminToken=sessionStorage.getItem('btAdminToken');if(customerId&&customerToken){try{await loadCustomerCloud();profile();return}catch(e){sessionStorage.removeItem('btCustomer');sessionStorage.removeItem('btToken');}}if(adminToken){await admin();return;}entry()}
restoreSession();
setInterval(async function(){
  if(!sessionStorage.getItem('btCustomer')||!sessionStorage.getItem('btToken'))return;
  try{await rpc('bt_customer_get',{p_token:sessionStorage.getItem('btToken')});}
  catch(e){
    const message=String(e?.message||e);
    if(message.includes('ACCOUNT_LOCKED')||message.includes('SUBSCRIPTION_REQUIRED')||message.includes('Invalid or expired customer session')){
      sessionStorage.removeItem('btCustomer');
      sessionStorage.removeItem('btToken');
      entry();
      toast('Your website access is locked or your session has expired. Please log in again.');
    }
  }
},30000);


async function loadAdminUltraShop(){const box=document.getElementById('adminUltraShop');if(!box)return;box.innerHTML='<p class="muted">Loading live supplier catalogue…</p>';try{const token=sessionStorage.getItem('btAdminToken'),r=await fetch('/.netlify/functions/admin-ultrasms-catalogue?token='+encodeURIComponent(token)+'&service=wa&country=NG',{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load UltraSMS catalogue.');const opts=(d.services||[]).map(x=>'<option value="'+esc(x.code)+'">'+esc(x.name||x.code)+'</option>').join(''),countries=(d.countries||[]).map(x=>{const c=x.code||x.country_code||x.iso2||x.id;return c?'<option value="'+esc(c)+'">'+esc(x.name||x.country||c)+'</option>':''}).join('');box.innerHTML='<label>Verification service</label><select id="adminUltraService" onchange="refreshAdminUltraPrices()">'+opts+'</select><label>Country</label><select id="adminUltraCountry" onchange="refreshAdminUltraPrices()">'+countries+'</select><div id="adminUltraPrices" class="payment-note">Choose a service and country.</div>';const sc=document.getElementById('adminUltraService'),cc=document.getElementById('adminUltraCountry');if(sc)sc.value='wa';if(cc)cc.value='NG';await refreshAdminUltraPrices()}catch(e){box.innerHTML='<p class="muted">'+esc(e.message)+'</p>'}}
async function refreshAdminUltraPrices(){const box=document.getElementById('adminUltraPrices');if(!box)return;const token=sessionStorage.getItem('btAdminToken'),service=document.getElementById('adminUltraService')?.value||'wa',country=document.getElementById('adminUltraCountry')?.value||'NG';box.textContent='Refreshing supplier prices…';try{const r=await fetch('/.netlify/functions/admin-ultrasms-catalogue?token='+encodeURIComponent(token)+'&service='+encodeURIComponent(service)+'&country='+encodeURIComponent(country),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load supplier prices.');const rows=(d.prices||[]).filter(x=>Number(x.count)>0);box.innerHTML=rows.map(x=>'<article class="history-item"><strong>Server '+esc(x.server)+' · '+esc(x.count)+' available</strong><p>Supplier price: '+money(Number(x.supplier_cost_ngn||0))+' each</p><button class="btn" onclick="adminBuyUltraNumber(\''+esc(service)+'\',\''+esc(country)+'\','+Number(x.server)+')">Buy at supplier price</button></article>').join('')||'<p class="muted">No available numbers for this selection.</p>'}catch(e){box.textContent=e.message}}
async function adminBuyUltraNumber(service,country,server){if(!confirm('Buy one '+service+' verification number for '+country+' at the current UltraSMS supplier price? The Admin Wallet will be charged.'))return;try{const r=await fetch('/.netlify/functions/admin-ultrasms-order-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btAdminToken'),service,country,server})}),d=await r.json();if(!r.ok&&!d.pending)throw new Error(d.error||'Purchase failed.');toast(d.pending?'Supplier confirmation is pending. Do not repeat the purchase.':'Supplier purchase submitted. '+(d.phone||''));await admin();}catch(e){toast(e.message||'Admin supplier purchase failed.')}}
async function loadAdminRediShop(){const box=document.getElementById('adminRediShop');if(!box)return;box.innerHTML='<p class="muted">Loading social account supplier prices…</p>';try{const r=await fetch('/.netlify/functions/rediprofiles-catalogue',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Could not load Rediprofiles catalogue.');const rows=(d.services||[]).filter(x=>Number(x.supplier_price_ngn)>0&&x.is_active!==false&&x.in_stock!==false);box.innerHTML=rows.map(x=>'<article class="history-item"><strong>'+esc(x.name||'Social media account')+'</strong><p>Supplier price only: '+money(Number(x.supplier_price_ngn))+'</p><button class="btn" onclick="adminBuyRediAccount(\''+esc(String(x.id))+'\')">Buy at supplier price</button></article>').join('')||'<p class="muted">No supplier-priced accounts are currently available.</p>'}catch(e){box.innerHTML='<p class="muted">'+esc(e.message)+'</p>'}}
async function adminBuyRediAccount(serviceId){if(!confirm('Purchase this social media account at the supplier price using the Admin Wallet?'))return;try{const r=await fetch('/.netlify/functions/admin-rediprofiles-order-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btAdminToken'),service_id:serviceId})}),d=await r.json();if(!r.ok&&!d.pending)throw new Error(d.error||'Purchase failed.');toast(d.pending?'Supplier confirmation is pending. Do not repeat the purchase.':'Social account purchase submitted.');await admin()}catch(e){toast(e.message||'Admin social account purchase failed.')}}
async function adminRediprofilesOrders(){const box=document.getElementById('adminRediprofilesOrders');if(!box)return;box.innerHTML='<div class="payment-note">Loading account orders…</div>';try{const token=sessionStorage.getItem('btAdminToken')||'';const r=await fetch('/.netlify/functions/rediprofiles-order?admin=1&token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Could not load account orders.');const rows=Array.isArray(d.orders)?d.orders:[];box.innerHTML=rows.map(o=>{const details=o.account_data&&typeof o.account_data==='object'?JSON.stringify(o.account_data,null,2):'';return `<article class="history-item"><strong>${esc(o.customer_name||'Customer')} · ${esc(o.service_name)}</strong><p>Order: <b>${esc(o.external_customer_ref)}</b></p><p>Supplier ref: ${esc(o.supplier_order_id||'Pending')} · Status: <b>${esc(String(o.status).toUpperCase())}</b></p><p>Customer price: ${money(Number(o.customer_price||0))} · Supplier cost: ${money(Number(o.supplier_price||0))}</p><div class="muted">${new Date(o.created_at).toLocaleString()}</div>${details?`<details><summary>View delivered account details</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(details)}</pre></details>`:''}</article>`;}).join('')||'<div class="empty">No ready-made account orders yet.</div>';}catch(e){box.innerHTML='<div class="payment-note">'+esc(e.message||'Could not load account orders.')+'</div>';}}
</script><script src="/funding-overrides.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script></body></html>
