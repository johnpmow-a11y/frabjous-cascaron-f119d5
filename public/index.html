</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ADS Manager — demonstration application. No real payment, ad placement,
   social-page creation, ATM access, or card processing is performed. */
const app=document.getElementById('app');
const SUPABASE_URL='https://ftwhcqrtmfxdzokmudvu.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_JmHGmEITDPfVyWrmQbuZsQ_Q82_CsEl';
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
async function rpc(fn,args){if(!db)throw new Error('Supabase did not load. Check your internet connection and refresh.');const {data,error}=await db.rpc(fn,args||{});if(error)throw error;return data;}
async function loadCustomerCloud(){const id=current(),token=sessionStorage.getItem('btToken');if(!id||!token)throw new Error('Your customer session has expired. Please log in again.');const cloud=await rpc('bt_customer_get',{p_token:token});const c=store.customers[id]||{id,name:'Customer'};store.customers[id]=c;const mine=(cloud.records||[]).map(r=>({...r,customerId:id,customerName:r.customerName||c.name}));store.records=[...store.records.filter(r=>r.customerId!==id),...mine];store.notes[id]=cloud.notes||[];store.bank=cloud.bank||null;store.prices=cloud.prices||{};store.pageInfo=store.prices.pageInfo||'';localStorage.setItem(KEY,JSON.stringify(store));return cloud;}
async function loadAdminCloud(){const token=sessionStorage.getItem('btAdminToken');if(!token)throw new Error('Administrator session token is missing. Please log in again.');const cloud=await rpc('bt_admin_get',{p_token:token});store.customers=cloud.customers||{};store.records=cloud.records||[];store.notes=cloud.notes||{};store.bank=cloud.bank||null;store.prices=cloud.prices||{};store.pageInfo=store.prices.pageInfo||'';localStorage.setItem(KEY,JSON.stringify(store));return cloud;}

const KEY='businessTools_demo_v1';
let store={};try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){store={}}
store.customers=store.customers||{};store.records=store.records||[];store.notes=store.notes||{};store.bank=store.bank||null;store.pageInfo=store.pageInfo||'';store.prices=store.prices||{};store.locks=store.locks||{};store.access=store.access||{};store.subscriptionRequests=store.subscriptionRequests||[];
const UK_VALUES=[2,5,15,33,55,120],USA_VALUES=[2,5,33,44,57,88],UK_RATE=2975,USA_RATE=2475;
const categories=['Celebrity Updates','Dating','Military Dating','Giveaway','Elon Musk','Hookup','XRP','PET','Tattoo','ETC'];
const countries=['🇳🇱 Netherlands','🇺🇸 United States','🇬🇧 United Kingdom','🇨🇦 Canada','🇦🇺 Australia','🇳🇬 Nigeria','🇬🇭 Ghana','🇿🇦 South Africa','🇩🇪 Germany','🇫🇷 France','🇪🇸 Spain','🇮🇹 Italy','🇯🇵 Japan','🇰🇷 South Korea','🇹🇭 Thailand','🇧🇷 Brazil','🇮🇳 India','🇸🇬 Singapore','🇦🇪 United Arab Emirates'];
function save(){localStorage.setItem(KEY,JSON.stringify(store))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '₦'+Number(n||0).toLocaleString('en-NG')}function toast(t){let x=document.querySelector('.toast');if(x){x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}}
function shell(html,admin=false){app.innerHTML=`<header class="topbar"><div class="brand">ADS Manager</div></header><main class="container">${html}</main>${admin?'':'<button class="tiny-admin" aria-label="Administrator" title="Administrator"></button>'}<div class="toast"></div>`;document.querySelector('.tiny-admin')?.addEventListener('click',adminLogin)}
function current(){return sessionStorage.getItem('btCustomer')}function me(){return store.customers[current()]||null}function guard(){if(!me()){entry();return false}return true}function recordsFor(id){return store.records.filter(r=>r.customerId===id)}
function codeHash(v){let h=2166136261;for(let i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function entry(){shell(`<section class="entry hero"><div class="entry-mark">BT</div><h1>ADS Manager</h1><p>A service platform for exploring digital services, advertising workflows and customer tools. Your account, requests and messages are securely connected to the ADS Manager cloud database.</p><div class="entry-actions"><button class="btn" onclick="accountForm('create')">Create New Account</button><button class="btn secondary" onclick="accountForm('login')">Log In</button></div></section>`)}
function accountForm(mode){let c=mode==='create';shell(`<div class="form"><h2>${c?'Create Account':'Log In'}</h2><p class="muted">${c?'Enter your full name exactly as it appears on the payment account you will use, then create a four-digit code.':'Enter the same full name and four-digit code you used when creating your account.'}</p><label>Username</label><input id="name" maxlength="40" autocomplete="username"><label>Four-digit security code</label><input id="code" maxlength="4" inputmode="numeric" type="password"><button class="btn" style="margin-top:18px" onclick="${c?'createCustomer()':'loginCustomer()'}">${c?'Create Account':'Log In'}</button><button class="btn secondary" style="margin-top:10px" onclick="entry()">Back</button></div>`)}
async function createCustomer(){let name=document.getElementById('name').value.trim(),code=document.getElementById('code').value;if(!name||!/^\d{4}$/.test(code))return toast('Enter your name and exactly four digits.');try{const c=await rpc('create_customer',{p_name:name,p_code:code});if(!c?.id||!c?.token)throw new Error('The database did not return a customer session.');store.customers[c.id]={id:c.id,name:c.name||name,created:c.created_at||new Date().toISOString()};sessionStorage.removeItem('btAdminToken');sessionStorage.removeItem('btSubscriptionToken');sessionStorage.setItem('btCustomer',c.id);sessionStorage.setItem('btToken',c.token);await loadCustomerCloud();profile()}catch(e){toast(e.message||'Account creation failed.')}}
async function loginCustomer(){let name=document.getElementById('name').value.trim(),code=document.getElementById('code').value;if(!name||!/^[0-9]{4}$/.test(code))return toast('Enter your name and exactly four digits.');try{const c=await rpc('bt_customer_login',{p_name:name,p_code:code});if(c?.locked){sessionStorage.removeItem('btCustomer');sessionStorage.removeItem('btToken');sessionStorage.removeItem('btAdminToken');sessionStorage.setItem('btSubscriptionToken',c.subscription_token);showSubscriptionPlans(c);return;}if(!c?.id||!c?.token)throw new Error('The database did not return a customer session.');store.customers[c.id]={id:c.id,name:c.name||name,created:c.created_at||new Date().toISOString()};sessionStorage.removeItem('btAdminToken');sessionStorage.removeItem('btSubscriptionToken');sessionStorage.setItem('btCustomer',c.id);sessionStorage.setItem('btToken',c.token);await loadCustomerCloud();profile()}catch(e){toast(e.message||'Login failed. Check your name and four-digit code.')}}
function logout(){sessionStorage.removeItem('btCustomer');sessionStorage.removeItem('btToken');sessionStorage.removeItem('btSubscriptionToken');entry()}
function showSubscriptionPlans(c){const prices=[3800,7600,11400,15200];shell(`<div class="form"><span class="eyebrow">ADS Manager ACCESS</span><h2>Website Access Locked</h2><p class="muted">This account is currently locked. Select a subscription duration to view the payment information.</p><label>Subscription duration</label><select id="subscriptionWeeks" onchange="updateSubscriptionQuote()"><option value="1">1 week — ₦3,800</option><option value="2">2 weeks — ₦7,600</option><option value="3">3 weeks — ₦11,400</option><option value="4">1 month (4 weeks) — ₦15,200</option></select><div id="subscriptionQuote" class="payment-note">Selected plan: 1 week · ₦3,800</div><button class="btn" style="margin-top:16px" onclick="confirmSubscription()">Continue</button><button class="btn secondary" style="margin-top:10px" onclick="entry()">Not Now</button></div>`)}
function updateSubscriptionQuote(){const w=Number(document.getElementById('subscriptionWeeks')?.value||1),amount=[3800,7600,11400,15200][w-1],q=document.getElementById('subscriptionQuote');if(q)q.textContent=`Selected plan: ${w===4?'1 month (4 weeks)':`${w} week${w===1?'':'s'}`} · ${money(amount)}`}
function confirmSubscription(){const token=sessionStorage.getItem('btSubscriptionToken');if(!token)return toast('Please log in again to continue.');const weeks=Number(document.getElementById('subscriptionWeeks')?.value||1),amount=[3800,7600,11400,15200][weeks-1];if(!confirm(`Continue with ${weeks===4?'1 month (4 weeks)':`${weeks} week${weeks===1?'':'s'}`} for ${money(amount)}?`))return;loading15('Loading subscription information','Please wait while we retrieve the administrator’s published bank information.',async()=>{try{const result=await rpc('bt_customer_request_subscription',{p_token:token,p_weeks:weeks});showSubscriptionBank(result,weeks,amount)}catch(e){toast(e.message||'Could not retrieve subscription information. Please log in again.');entry()}})}
function showSubscriptionBank(result,weeks,amount){const bank=result?.bank;if(bank&&Object.values(bank).some(v=>String(v??'').trim())){shell(`<div class="payment-card"><h2>Subscription Payment Information</h2><p class="payment-note">Selected plan: ${weeks} week${weeks===1?'':'s'} · ${money(amount)}</p><div class="bank-details">${Object.entries(bank).filter(([k,v])=>k!=='updatedAt'&&String(v||'').trim()).map(([k,v])=>`<div><span>${esc(k.toUpperCase())}</span><strong>${esc(v)}</strong></div>`).join('')}</div><p class="payment-note">Your subscription request has been sent to the administrator. Access remains locked until payment is verified and the administrator unlocks your account.</p><button class="btn" onclick="entry()">Return to Login</button></div>`);return;}shell(`<div class="payment-card"><h2>Bank Not Available</h2><p class="payment-note">The administrator has not published bank information yet. Please try again later.</p><button class="btn" onclick="entry()">Return to Login</button></div>`)}
async function profile(){if(!guard())return;let c=me(),n=(store.notes[c.id]||[]).length,wallet={balance:0,transactions:[]};try{wallet=await rpc('bt_customer_wallet_get',{p_token:sessionStorage.getItem('btToken')})}catch(e){}shell(`<div class="profile-head"><div><span class="eyebrow">CUSTOMER DASHBOARD</span><h1>Welcome, ${esc(c.name)}</h1></div><button class="btn secondary compact" onclick="logout()">Log Out</button></div><section class="profile-card" style="margin-bottom:18px"><span class="eyebrow">AVAILABLE BALANCE</span><h2 style="font-size:32px;margin:8px 0">${money(wallet.balance||0)}</h2><button class="btn" onclick="addFundsPage()">＋ Add Funds</button></section><div class="profile-grid"><section class="profile-card"><div class="profile-icon">ADS</div><h2>Available Services</h2><div class="profile-buttons">${serviceButtons()}</div></section><section class="profile-card history-card"><div class="history-icon">▤</div><h2>History</h2><div class="history-count">${n} messages</div><button class="btn" onclick="historyPage()">Open History</button><button class="btn secondary" style="margin-top:10px" onclick="walletHistoryPage()">Payment History</button></section></div>`)}
function addFundsPage(){if(!guard())return;shell(`<button class="btn secondary back" onclick="profile()">← Back</button><div class="form"><span class="eyebrow">ADS MANAGER WALLET</span><h2>Add Funds</h2><label>Amount (₦100 – ₦3,000,000)</label><input id="walletAmount" type="number" min="100" max="3000000" step="100" value="100"><label>Email for payment receipt</label><input id="walletEmail" type="email" autocomplete="email" placeholder="you@example.com"><label>Payment method</label><select id="walletMethod"><option value="bank_transfer">Bank Transfer</option><option value="card">ATM / Card Payment</option></select><p class="muted">Bank Transfer opens Paystack's secure transfer checkout. ATM/Card Payment opens Paystack's secure card checkout. Card details are entered only on Paystack.</p><button class="btn" style="margin-top:12px" onclick="startWalletPayment()">Continue to Paystack</button></div>`)}
async function startWalletPayment(){if(!guard())return;const amount=Number(document.getElementById('walletAmount').value),email=document.getElementById('walletEmail').value.trim(),method=document.getElementById('walletMethod').value;if(!Number.isInteger(amount)||amount<100||amount>3000000)return toast('Choose an amount from ₦100 to ₦3,000,000.');if(!/^\S+@\S+\.\S+$/.test(email))return toast('Enter a valid email address.');const button=document.querySelector('.form .btn:last-child');if(button){button.disabled=true;button.textContent='Connecting to Paystack…'}try{const response=await fetch('/.netlify/functions/paystack-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btToken'),amount,email,method})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not start payment.');sessionStorage.setItem('btPendingPaymentReference',result.reference);location.href=result.authorization_url}catch(e){toast(e.message||'Payment could not be started.');if(button){button.disabled=false;button.textContent='Continue to Paystack'}}}

async function refreshUltraSmsCatalog(initial=false){
 const service=document.getElementById('smsService')?.value||'wa',country=document.getElementById('smsCountry')?.value||'NG';
 const button=document.getElementById('smsRefresh'),stock=document.getElementById('smsStock'),balance=document.getElementById('smsBalance');
 if(button){button.disabled=true;button.textContent='Refreshing…'}
 if(stock)stock.innerHTML='<div class="muted">Loading current supplier stock…</div>';
 try{
  const response=await fetch(`/.netlify/functions/ultra-sms-catalog?service=${encodeURIComponent(service)}&country=${encodeURIComponent(country)}`,{headers:{'Accept':'application/json'},cache:'no-store'});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not load the supplier catalogue.');
  const serviceSelect=document.getElementById('smsService'),countrySelect=document.getElementById('smsCountry');
  if(serviceSelect&&data.services?.length){const old=serviceSelect.value;serviceSelect.innerHTML=data.services.map(x=>`<option value="${esc(x.code)}">${esc(x.name)}</option>`).join('');serviceSelect.value=data.services.some(x=>x.code===old)?old:(data.services.some(x=>x.code==='wa')?'wa':data.services[0].code);}
  if(countrySelect&&data.countries?.length){const old=countrySelect.value;countrySelect.innerHTML=data.countries.map(x=>`<option value="${esc(x.code)}">${esc(x.name)} (${esc(x.code)})</option>`).join('');countrySelect.value=data.countries.some(x=>x.code===old)?old:(data.countries.some(x=>x.code==='NG')?'NG':data.countries[0].code);}
  if(balance)balance.textContent=data.balance?`Ultra SMS supplier balance: ${data.balance.balance||'—'} ${data.balance.currency||'USD'}`:'Supplier balance unavailable.';
  if(stock){const rows=(data.prices||[]).filter(x=>x.service==='wa'&&String(x.country).toUpperCase()===country);const fx=Number(data.fxNgnPerUsd),markup=Number(data.markupPercent||3);stock.innerHTML=rows.length?rows.map(x=>{const cents=Number(x.price_cents),quote=Number.isFinite(fx)&&fx>0&&Number.isSafeInteger(cents)?Math.round(Math.round(cents*fx)*(1+markup/100))/100:null;return `<article><strong>${esc(x.name||data.selectedServiceName||'WhatsApp verification number')}</strong><div class="muted">Country: ${esc(x.country||country)} · Server: ${esc(x.server)}</div><div class="muted">Supplier price: ${esc(x.price||'—')} ${esc(data.currency||'USD')}</div><div class="price">${quote===null?'NGN price unavailable':money(quote)}</div><div class="muted">Available stock: <b>${Number(x.count||0).toLocaleString()}</b></div><button class="btn" ${Number(x.count||0)<1||quote===null?'disabled':''} onclick="buyUltraSmsNumber(${Number(x.server)},${cents},${quote===null?0:quote},'${country}')">Buy Number</button></article>`}).join(''):'<div class="empty">No WhatsApp stock is currently listed for this country. Try another country or refresh later.</div>';}
  const updated=document.getElementById('smsUpdated');if(updated)updated.textContent=`Live supplier catalogue checked: ${new Date().toLocaleString()}. Stock and prices can change before an order.`;
  // If the first call normalized the dropdown to another available option, refresh its price rows.
  if(initial&&(serviceSelect?.value!==service||countrySelect?.value!==country))return refreshUltraSmsCatalog(false);
 }catch(e){if(balance)balance.textContent='Supplier connection error: '+(e.message||'Unknown error');if(stock)stock.innerHTML='<div class="empty">Live catalogue could not be loaded. Check the Netlify deployment and ULTRA_SMS_API_KEY setting.</div>';}
 finally{if(button){button.disabled=false;button.textContent='Refresh live stock'}}
}

async function buyUltraSmsNumber(server,supplierCents,customerPriceNgn,country){
 if(!guard())return;
 if(!Number.isInteger(server)||!Number.isSafeInteger(supplierCents)||supplierCents<=0||!Number.isFinite(customerPriceNgn)||customerPriceNgn<=0)return toast('The live price is unavailable. Refresh the catalogue.');
 if(!confirm(`Buy one temporary WhatsApp verification number for ${money(customerPriceNgn)} from your ADS Manager wallet? The number normally expires after about 20 minutes.`))return;
 const stock=document.getElementById('smsStock');
 if(stock)stock.insertAdjacentHTML('afterbegin','<div class="payment-note" id="smsBuying">Reserving your number and checking your wallet…</div>');
 try{
  const countryName=document.getElementById('smsCountry')?.selectedOptions?.[0]?.textContent||country;
  const response=await fetch('/.netlify/functions/ultra-sms-order-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btToken'),service:'wa',country,server,displayed_price_cents:supplierCents,displayed_customer_price_ngn:customerPriceNgn,country_name:countryName})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Could not buy this number.');
  const o=data.order||{};
  toast(data.pending?'Your order is being reconciled. Do not purchase again.':'Your number order was created.');
  const box=document.getElementById('smsOrders');
  if(box)box.innerHTML=`<article class="history-item"><strong>WhatsApp number order</strong><p>Number: <b>${esc(o.phone||'Being assigned')}</b></p><p>SMS code: <b>${esc(o.sms_code||o.code||'Waiting for SMS')}</b></p><p>Status: ${esc(o.status||data.provider_status||'Processing')}</p><p class="muted">${esc(data.message||'Your number is temporary and may expire after about 20 minutes.')}</p></article>`;
  await refreshUltraSmsOrders();
 }catch(e){toast(e.message||'Number purchase failed.');}
 finally{document.getElementById('smsBuying')?.remove();}
}

 }catch(e){box.innerHTML='<div class="empty">'+esc(e.message||'Could not load your number orders.')+'</div>';}
}

else {html=`<label>${service==='Zangi Ads'?'Name':'Page Name or Name'}</label><input id="pageName" required>${service!=='Zangi Ads'?`<label>Category</label><select id="category" onchange="customCategoryToggle()">${categoryOptions()}</select><input id="customCategory" placeholder="Enter custom category" style="display:none;margin-top:8px">`:''}${service==='Zangi Ads'?'<label>Zangi link</label><input id="zangiLink" placeholder="https://">':''}<label>Targeting Country</label><select id="country">${countryOptions()}</select><label>State / Province (optional)</label><input id="region" placeholder="State or province"><label>Age</label><div class="actions"><input id="ageMin" type="number" min="18" max="80" value="18" aria-label="Minimum age"><input id="ageMax" type="number" min="18" max="80" value="65" aria-label="Maximum age"></div><label>Gender</label><select id="gender"><option>Female</option><option>Male</option></select><label>Duration (days)</label><input id="duration" type="number" min="1" max="14" value="1" oninput="updateServiceQuote('${service}')">${service==='TikTok Ads'?`<h3>SUBMIT THREE INFORMATION</h3><label>WhatsApp link (optional)</label><input id="whatsapp"><label>Zangi link (optional)</label><input id="zangi"><label>Signal link (optional)</label><input id="signal"><label>Telegram link (optional)</label><input id="telegram">`:''}<label>Pictures (up to 3)</label><input id="pictures" type="file" accept="image/*" multiple onchange="checkPictures()"><p class="muted">Pictures are compressed and saved with your request so you can view them on another device.</p>`}

function readImageForCloud(file){return new Promise((resolve,reject)=>{const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{try{const max=1280,scale=Math.min(1,max/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{URL.revokeObjectURL(url);if(!blob)return reject(new Error('Picture compression failed. Please choose another picture.'));const reader=new FileReader();reader.onload=()=>resolve({name:file.name,data:reader.result});reader.onerror=()=>reject(new Error('Could not read the selected picture.'));reader.readAsDataURL(blob)},'image/jpeg',0.72)}catch(e){URL.revokeObjectURL(url);reject(e)}};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not open one of the selected pictures.'))};image.src=url})}

let min=Number(document.getElementById('ageMin').value),max=Number(document.getElementById('ageMax').value);if(min<18||max>80||min>max)return toast('Age must be between 18 and 80.');if(duration<1||duration>14)return toast('Enter a duration between 1 and 14 days.');details.category=document.getElementById('category')?.value==='ETC'?(document.getElementById('customCategory').value.trim()||'ETC'):document.getElementById('category')?.value;details.country=document.getElementById('country').value;details.state=document.getElementById('region').value;details.age=`${min}-${max}`;details.gender=document.getElementById('gender').value;details.duration=duration+' days';if(service==='Zangi Ads')details.zangiLink=document.getElementById('zangiLink').value;if(service==='TikTok Ads')for(let k of ['whatsapp','zangi','signal','telegram'])details[k]=document.getElementById(k).value;let price=service==='Facebook Ads'?8500+(duration-1)*3800:service==='TikTok Ads'?10500+(duration-1)*3800:7800+(duration-1)*2800;let files=[...(document.getElementById('pictures')?.files||[])];if(files.length>3)return toast('Maximum three pictures.');Promise.all(files.map(readImageForCloud)).then(pics=>{if(pics.length)details.creative_files=pics.map(p=>p.name);return serviceCheckout({service,details:JSON.stringify(details),price,status:'Awaiting verified payment',pictures:pics})}).catch(e=>toast(e.message||'Could not prepare the selected pictures.'));}
async function recordAdmin(data){if(!guard())return false;let c=me();data.customerId=c.id;data.customerName=c.name;data.id='BT-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);data.time=new Date().toISOString();data.paymentStatus=data.paymentStatus||'Not verified';data.processingStatus=data.status||'Received';store.records.push(data);localStorage.setItem(KEY,JSON.stringify(store));try{await rpc('bt_customer_save_records',{p_token:sessionStorage.getItem('btToken'),p_records:store.records.filter(r=>r.customerId===c.id)});return true}catch(e){store.records=store.records.filter(r=>r.id!==data.id);localStorage.setItem(KEY,JSON.stringify(store));throw e}}

let pendingServiceCheckout=null;
function serviceCheckout(data){
 if(!guard())return;

 shell(`<button class="btn secondary back" onclick="profile()">← Back</button><div class="form"><span class="eyebrow">SECURE SERVICE CHECKOUT</span><h2>${esc(data.service)}</h2><p class="payment-note">Amount to pay: <strong>${money(data.price)}</strong></p><label>Email for Paystack receipt</label><input id="servicePaymentEmail" type="email" autocomplete="email" placeholder="you@example.com"><label>Payment method</label><select id="servicePaymentMethod"><option value="bank_transfer">Bank Transfer</option><option value="card">ATM / Card Payment</option></select><p class="muted">Payment is processed securely by Paystack. Your order is submitted only after payment is verified.</p><button class="btn" id="servicePayButton" onclick="startServiceCheckout()">Continue to Paystack</button></div>`);

async function startServiceCheckout(){
 if(!guard()||!pendingServiceCheckout)return;
 const email=document.getElementById('servicePaymentEmail')?.value.trim()||'';
 const method=document.getElementById('servicePaymentMethod')?.value||'';
 if(!/^\S+@\S+\.\S+$/.test(email))return toast('Enter a valid email address for your receipt.');
 const button=document.getElementById('servicePayButton');
 if(button){button.disabled=true;button.textContent='Connecting to Paystack…'}
 try{
  const d=pendingServiceCheckout;
  const response=await fetch('/.netlify/functions/paystack-service-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionStorage.getItem('btToken'),email,method,service:d.service,details:d.details,amount:d.price})});
  const result=await response.json();
  if(!response.ok||!result.authorization_url)throw new Error(result.error||'Could not start service payment.');
  sessionStorage.setItem('btPendingServiceReference',result.reference);
  try{
   const orderRecord={service:d.service,details:d.details,price:d.price,status:'Awaiting payment verification',paymentStatus:'Pending',processingStatus:'Awaiting Paystack payment',pictures:d.pictures||[],servicePaymentReference:result.reference};
   await recordAdmin(orderRecord);
  }catch(saveError){toast('Payment is ready. Your order details will be attached after verification.');}
  location.href=result.authorization_url;
 }catch(e){
  toast(e.message||'Could not start service payment.');
  if(button){button.disabled=false;button.textContent='Continue to Paystack'}
 }
}

async function checkAdmin(){
  const input = document.getElementById('apass');
  const button = document.getElementById('adminLoginButton');
  const status = document.getElementById('adminLoginStatus');

  if(!input || !input.value.trim()){
    if(status) status.textContent = 'Please enter your admin password.';
    return;
  }

  button.disabled = true;
  button.textContent = 'Checking...';
  if(status) status.textContent = '';

  try {
    const r = await rpc('admin_login', {
      p_password: input.value
    });

    if(!r?.token){
      throw new Error('The database did not return an administrator session.');
    }

    sessionStorage.removeItem('btCustomer');
    sessionStorage.removeItem('btToken');
    sessionStorage.setItem('btAdminToken', r.token);

    await admin();

  } catch(e) {
    if(status){
      status.textContent = e.message || 'Administrator login failed.';
    }
  } finally {
    const currentButton = document.getElementById('adminLoginButton');
    if(currentButton){
      currentButton.disabled = false;
      currentButton.textContent = 'Log In';
    }
  }
}
