<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b2a"><title>Apple Payment — All Ads Manager</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f6f5;color:#172b2a;font:16px system-ui,-apple-system,sans-serif}.card{width:min(100%,460px);padding:28px;border:1px solid #e1e8e5;border-radius:22px;background:white;text-align:center;box-shadow:0 14px 40px #14201a12}.apple{font-size:42px}.muted{color:#65736d;line-height:1.55}.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#176b55;color:white;font-weight:750;font-size:16px;text-decoration:none;margin-top:14px}</style></head><body><main class="card"><div class="apple">🍎</div><h1>Apple Fruit Payment</h1><p id="status" class="muted">Checking your Paystack payment…</p><a id="back" class="btn" href="/" hidden>Return to All Ads Manager</a></main><script>const q=new URLSearchParams(location.search),reference=q.get('reference')||sessionStorage.getItem('btAdminAppleReference')||'',token=sessionStorage.getItem('btAdminToken')||'';async function run(){const status=document.getElementById('status'),back=document.getElementById('back');if(!reference||!token){status.textContent='Payment reference or administrator session is missing. Sign in again and check Apple Purchase History.';back.hidden=false;return}try{const r=await fetch('/.netlify/functions/admin-apple-verify?reference='+encodeURIComponent(reference)+'&token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not verify payment.');status.textContent=d.message||'Payment status: '+d.status;if(d.status==='paid')sessionStorage.removeItem('btAdminAppleReference');back.hidden=false;}catch(e){status.textContent=e.message||'Payment verification failed. Do not pay again until you check the purchase history.';back.hidden=false;}}run();</script></body></html>
